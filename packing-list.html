    h+='<textarea class="input-field" rows="3" style="width:100%;" onchange="window._plSet(\'remarks\',this.value)">'+esc(d.remarks||'')+'</textarea></div>';
  }
  if(isFld('signature.name')||isFld('signature.title')||isFld('signature.date')){
    h+='<div class="section-card"><h3>'+fB(isZh?'签名':'Signature','')+'</h3><div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));">';
    if(isFld('signature.name'))h+=lI(isZh?'签名':'Signature Name',d.signatureName,'signatureName','');
    if(isFld('signature.title'))h+=lI(isZh?'职务':'Title',d.signatureTitle,'signatureTitle','');
    if(isFld('signature.date'))h+=lID(isZh?'日期':'Date',d.signatureDate,'signatureDate');
    h+='</div></div>';
  }
  document.getElementById('form-container').innerHTML=h;
}
function renderPreview(){
  var d=data,isZh2=previewLang==='zh';
  function tr2(en,zh){return isZh2?zh:en;}
  var items=d.items||[];
  var totalPkgsCalc=items.reduce(function(s,it){return s+(parseFloat(it.noOfPkgs)||0);},0);
  var totalNetW=items.reduce(function(s,it){return s+(parseFloat(it.netWeight)||0);},0);
  var totalGrossW=items.reduce(function(s,it){return s+(parseFloat(it.grossWeight)||0);},0);
  var totalMeasCalc=items.reduce(function(s,it){return s+(parseFloat(it.measurement)||0);},0);
  var h='<div class="invoice-preview" id="preview-content">';
  h+='<div class="title">'+tr2('PACKING LIST','装箱单')+'</div>';
  h+='<div class="two-col" style="gap:20px;">';
  h+='<div style="flex:1;">';
  if(isFld('shipper.shipperCompany')||isFld('shipper.shipperName')||isFld('shipper.shipperAddress')||isFld('shipper.shipperPhone')){
    h+='<div class="address-block"><div class="addr-label">'+tr2('SHIPPER','发货人')+':</div>';
    if(isFld('shipper.shipperCompany')&&d.shipperCompany)h+='<div>'+esc(d.shipperCompany)+'</div>';
    if(isFld('shipper.shipperAddress')&&d.shipperAddress)h+='<div>'+esc(d.shipperAddress)+'</div>';
    if(isFld('shipper.shipperName')&&d.shipperName)h+='<div>'+esc(d.shipperName)+'</div>';
    if(isFld('shipper.shipperPhone')&&d.shipperPhone)h+='<div>'+esc(d.shipperPhone)+'</div>';
    h+='</div>';
  }
  h+='</div><div style="flex:1;">';
  if(isFld('consignee.consigneeCompany')||isFld('consignee.consigneeName')||isFld('consignee.consigneeAddress')||isFld('consignee.consigneePhone')){
    h+='<div class="address-block"><div class="addr-label">'+tr2('CONSIGNEE','收货人')+':</div>';
    if(isFld('consignee.consigneeCompany')&&d.consigneeCompany)h+='<div>'+esc(d.consigneeCompany)+'</div>';
    if(isFld('consignee.consigneeAddress')&&d.consigneeAddress)h+='<div>'+esc(d.consigneeAddress)+'</div>';
    if(isFld('consignee.consigneeName')&&d.consigneeName)h+='<div>'+esc(d.consigneeName)+'</div>';
    if(isFld('consignee.consigneePhone')&&d.consigneePhone)h+='<div>'+esc(d.consigneePhone)+'</div>';
    h+='</div>';
  }
  h+='</div>';
  h+='</div>';
  var leftShipFlds=[
    {key:'shipping.invoiceNo',label:'Invoice No.',labelCn:'发票号',val:d.invoiceNo},
    {key:'shipping.poNo',label:'PO No.',labelCn:'订单号',val:d.poNo},
    {key:'shipping.dateOfExport',label:'Date of Export',labelCn:'出口日期',val:d.dateOfExport},
    {key:'shipping.waybillNo',label:'Waybill No.',labelCn:'运单号',val:d.waybillNo}
  ];
  var rightShipFlds=[
    {key:'shipping.vessel',label:'Vessel',labelCn:'船名',val:d.vessel},
    {key:'shipping.portOfLoading',label:'Port of Loading',labelCn:'装货港',val:d.portOfLoading},
    {key:'shipping.portOfDischarge',label:'Port of Discharge',labelCn:'卸货港',val:d.portOfDischarge}
  ];
  var hasLeft=leftShipFlds.some(function(f){return isFld(f.key);});
  var hasRight=rightShipFlds.some(function(f){return isFld(f.key);});
  if(hasLeft||hasRight){
    h+='<div class="field-row" style="gap:20px;"><div style="flex:1;">';
    leftShipFlds.forEach(function(f){
      if(isFld(f.key))h+='<div class="field-row"><span style="font-weight:bold;min-width:80px;flex-shrink:0;">'+(isZh2?f.labelCn:f.label)+':</span><span class="field-value">'+esc(f.val||'—')+'</span></div>';
    });
    h+='</div><div style="flex:1;">';
    rightShipFlds.forEach(function(f){
      if(isFld(f.key))h+='<div class="field-row"><span style="font-weight:bold;min-width:80px;flex-shrink:0;">'+(isZh2?f.labelCn:f.label)+':</span><span class="field-value">'+esc(f.val||'—')+'</span></div>';
    });
    h+='</div></div>';
  }
  var itemCols=[
    {key:'items.marks',label:"MARKS",labelCn:'唛头',width:'12%',field:'marks',render:function(v){return v||'—';}},
    {key:'items.noOfPkgs',label:'NO.PKGS',labelCn:'件数',width:'8%',field:'noOfPkgs',render:function(v){return v||'—';}},
    {key:'items.typeOfPackaging',label:'PACKAGING',labelCn:'包装类型',width:'10%',field:'typeOfPackaging',render:function(v){return v||'—';}},
    {key:'items.description',label:'DESCRIPTION',labelCn:'描述',width:'22%',field:'description',render:function(v){return v||'—';}},
    {key:'items.qty',label:'QTY',labelCn:'数量',width:'7%',field:'qty',render:function(v){return v||'—';}},
    {key:'items.unitOfMeasure',label:'UNIT',labelCn:'单位',width:'7%',field:'unitOfMeasure',render:function(v){return v||'—';}},
    {key:'items.netWeight',label:'N.W.(KG)',labelCn:'净重(kg)',width:'10%',field:'netWeight',render:function(v){return v||'—';}},
    {key:'items.grossWeight',label:'G.W.(KG)',labelCn:'毛重(kg)',width:'10%',field:'grossWeight',render:function(v){return v||'—';}},
    {key:'items.measurement',label:'MEAS.(CBM)',labelCn:'体积(CBM)',width:'10%',field:'measurement',render:function(v){return v||'—';}}
  ];
  var visCols=itemCols.filter(function(c){return isFld(c.key);});
  h+='<table class="items"><thead><tr><th style="width:5%;">#</th>';
  visCols.forEach(function(c){h+='<th style="width:'+c.width+';">'+(isZh2?c.labelCn:c.label)+'</th>';});
  h+='</tr></thead><tbody>';
  d.items.forEach(function(it,idx){
    h+='<tr><td class="text-center">'+(idx+1)+'</td>';
    visCols.forEach(function(c){
      var cls='text-center';
      if(c.field==='netWeight'||c.field==='grossWeight'||c.field==='measurement')cls='text-right';
      if(c.field==='description')cls='whitespace-pre-wrap';
      h+='<td class="'+cls+'">'+c.render(it[c.field])+'</td>';
    });
    h+='</tr>';
  });
  var hasTotals=isFld('totals.totalPkgs')||isFld('totals.totalNetWeight')||isFld('totals.totalGrossWeight')||isFld('totals.totalMeasurement');
  if(hasTotals){
    h+='<tr class="total-row"><td></td>';
    visCols.forEach(function(c,idx){
      if(idx===0){
        h+='<td class="text-left font-bold">'+tr2('TOTAL','合计')+':</td>';
      }else if(c.field==='noOfPkgs'){
        h+='<td class="font-bold">'+(d.totalPkgs||totalPkgsCalc||'—')+'</td>';
      }else if(c.field==='netWeight'){
        h+='<td class="text-right font-bold">'+(d.totalNetWeight||totalNetW.toFixed(2))+'</td>';
      }else if(c.field==='grossWeight'){
        h+='<td class="text-right font-bold">'+(d.totalGrossWeight||totalGrossW.toFixed(2))+'</td>';
      }else if(c.field==='measurement'){
        h+='<td class="text-right font-bold">'+(d.totalMeasurement||totalMeasCalc||'—')+'</td>';
      }else{
        h+='<td></td>';
      }
    });
    h+='</tr>';
  }
  h+='</tbody></table>';
  if(isFld('remarks.text')&&d.remarks){
    h+='<div class="remarks-block" style="margin-top:10px;font-size:12px;font-style:italic;">';
    h+='<div style="font-weight:bold;font-style:normal;">'+tr2('Remarks','备注')+':</div>';
    h+='<div>'+esc(d.remarks)+'</div></div>';
  }
  if(isFld('signature.name')||isFld('signature.title')||isFld('signature.date')){
    h+='<div class="signature-block">';
    if(isFld('signature.name')&&d.signatureName)h+='<div>'+tr2('Signature','签名')+': '+esc(d.signatureName)+'</div>';
    if(isFld('signature.title')&&d.signatureTitle)h+='<div>'+tr2('Title','职务')+': '+esc(d.signatureTitle)+'</div>';
    if(isFld('signature.date')&&d.signatureDate)h+='<div>'+tr2('Date','日期')+': '+esc(d.signatureDate)+'</div>';
    h+='</div>';
  }
  h+='</div>';
  document.getElementById('preview-container').innerHTML=h;
}
function renderHistory(){
  var tr=I18N[lang],snaps=loadSnapshots(DT),search=(document.getElementById('history-search').value||'').toLowerCase();
  if(search)snaps=snaps.filter(function(s){return(s.label||'').toLowerCase().indexOf(search)!==-1||(s.ref||'').toLowerCase().indexOf(search)!==-1;});
  var h='';if(snaps.length===0){h+='<div class="history-empty">'+svg('Clock',48)+'<p>'+tr.noHistory+'</p></div>';}
  else{h+='<div style="margin-bottom:12px;font-size:13px;color:var(--text-muted);">'+snaps.length+' '+tr.records+'</div><div class="history-list">';
  snaps.forEach(function(s){h+='<div class="history-item"><div class="history-item-info"><div class="history-item-label">'+esc(s.label||'draft')+'</div>';
  h+='<div class="history-item-ref">'+esc(s.ref||'')+' — '+formatDateTime(s.exportedAt)+'</div></div><div class="history-item-actions">';
  h+='<button class="btn btn-secondary btn-sm" onclick="window._plRestore(\''+s.id+'\')">'+tr.restore+'</button>';
  h+='<button class="btn btn-danger btn-sm" onclick="window._plDeleteSnap(\''+s.id+'\')">'+tr.delete+'</button></div></div>';});
  h+='</div><div style="margin-top:16px;"><button class="btn btn-secondary btn-sm" onclick="window._plClearAllHistory()">'+tr.clearAll+'</button></div>';}
  document.getElementById('history-container').innerHTML=h;document.getElementById('history-search').oninput=function(){renderHistory();};
}
function renderClearModal(){var tr=I18N[lang],m=document.getElementById('clear-modal');if(showClearConfirm){m.classList.remove('hidden');
document.getElementById('clear-title').textContent=tr.clearTitle;document.getElementById('clear-msg').textContent=tr.clearMsg;
document.getElementById('btn-cancel-clear').textContent=tr.cancel;document.getElementById('btn-confirm-clear').textContent=tr.clear;}else m.classList.add('hidden');}
function renderTmplBar(){
  var isZh=lang==='zh';
  var data=ensureTmplData(DT,PL_DEFAULT_FIELDS);
  var current=getCurrentTmpl(DT,PL_DEFAULT_FIELDS);
  document.getElementById('tmpl-config-text').textContent=isZh?'字段配置':'Field Config';
  document.getElementById('tmpl-label-text').textContent=isZh?'模板':'Template';
  document.getElementById('tmpl-save-text').textContent=isZh?'保存':'Save';
  document.getElementById('tmpl-new-text').textContent=isZh?'新建':'New';
  document.getElementById('tmpl-delete-text').textContent=isZh?'删除':'Delete';
  var sel=document.getElementById('tmpl-selector');sel.innerHTML='';
  data.templates.forEach(function(t){
    var o=document.createElement('option');o.value=t.id;
    o.textContent=t.name+(t.builtIn?(isZh?' (默认)':' (Default)'):'');
    if(t.id===data.currentTemplateId)o.selected=true;sel.appendChild(o);
  });
  if(!sel.value&&sel.options.length>0){sel.value=sel.options[0].value;}
  var isBuiltIn=current?current.builtIn:true;
  document.getElementById('btn-tmpl-delete').classList.toggle('hidden',isBuiltIn);
  previewLang=getTmplPreviewLang(DT,PL_DEFAULT_FIELDS);
}
function renderTmplModal(){
  var isZh=lang==='zh',t=getCurrentTmpl(DT,PL_DEFAULT_FIELDS);
  if(!t)return;
  document.getElementById('tmpl-modal-title').textContent=(isZh?'字段配置 - ':'Field Config - ')+t.name;
  var sections=[
    {title:isZh?'发货人':'Shipper',fields:['shipper.shipperCompany','shipper.shipperAddress','shipper.shipperName','shipper.shipperPhone']},
    {title:isZh?'收货人':'Consignee',fields:['consignee.consigneeCompany','consignee.consigneeAddress','consignee.consigneeName','consignee.consigneePhone']},
    {title:isZh?'装运信息':'Shipping Info',fields:['shipping.invoiceNo','shipping.poNo','shipping.dateOfExport','shipping.waybillNo','shipping.vessel','shipping.portOfLoading','shipping.portOfDischarge']},
    {title:isZh?'货品明细列':'Item Table Columns',fields:['items.marks','items.noOfPkgs','items.typeOfPackaging','items.description','items.qty','items.unitOfMeasure','items.netWeight','items.grossWeight','items.measurement']},
    {title:isZh?'汇总行':'Totals',fields:['totals.totalPkgs','totals.totalNetWeight','totals.totalGrossWeight','totals.totalMeasurement']},
    {title:isZh?'备注':'Remarks',fields:['remarks.text']},
    {title:isZh?'签名':'Signature',fields:['signature.name','signature.title','signature.date']}
  ];
  var body='';
  sections.forEach(function(sec){
    if(sec.fields.length===0)return;
    body+='<div style="margin-bottom:14px;"><div style="font-weight:700;margin-bottom:6px;font-size:14px;">'+sec.title+'</div>';
    sec.fields.forEach(function(fk){
      var meta=PL_FIELD_META[fk];if(!meta)return;
      var val=t.fields[fk];
      var isReq=val==='required';
      var checked=isReq||val===true;
      body+='<label style="display:inline-block;width:48%;margin-bottom:4px;font-size:13px;">';
      body+='<input type="checkbox" data-fk="'+fk+'" '+(checked?'checked':'')+' '+(isReq?'disabled':'')+'>';
      body+=(isZh?meta.labelCn:meta.label);
      if(isReq)body+=' <span style="color:#dc2626;font-size:10px;">*</span>';
      body+='</label>';
    });
    body+='</div>';
  });
  body+='<div style="margin-top:12px;border-top:1px solid #ddd;padding-top:12px;">';
  body+='<span style="font-size:13px;font-weight:600;">'+(isZh?'预览语言':'Preview Language')+':</span>';
  body+='<label style="margin-left:8px;font-size:13px;"><input type="radio" name="tmpl-preview-lang" value="zh" '+(t.previewLang==='zh'?'checked':'')+'> 中文</label>';
  body+='<label style="margin-left:8px;font-size:13px;"><input type="radio" name="tmpl-preview-lang" value="en" '+(t.previewLang==='en'?'checked':'')+'> English</label></div>';
  document.getElementById('tmpl-modal-body').innerHTML=body;
  var tr=I18N[lang];
  document.getElementById('btn-tmpl-modal-cancel').textContent=tr.cancel;
  document.getElementById('btn-tmpl-modal-save').textContent=tr.saveTemplate;
  document.getElementById('tmpl-modal').classList.remove('hidden');
}
function doSaveTmplFromModal(){
  var data=ensureTmplData(DT,PL_DEFAULT_FIELDS);
  var tmpl=data.templates.find(function(t){return t.id===data.currentTemplateId;});
  if(!tmpl)return;
  var langRadio=document.querySelector('input[name="tmpl-preview-lang"]:checked');
  if(langRadio)tmpl.previewLang=langRadio.value;
  if(!tmpl.builtIn){
    var checks=document.querySelectorAll('#tmpl-modal-body input[type="checkbox"]');
    checks.forEach(function(cb){
      var fk=cb.getAttribute('data-fk');
      if(fk&&PL_DEFAULT_FIELDS[fk]!=='required'){tmpl.fields[fk]=cb.checked;}
    });
  }
  saveTmplData(DT,data);
  previewLang=tmpl.previewLang;
  document.getElementById('tmpl-modal').classList.add('hidden');
  renderTmplBar();renderForm();renderPreview();
}
function setupTmplEvents(){
  document.getElementById('btn-tmpl-config').onclick=function(){renderTmplModal();};
  document.getElementById('btn-tmpl-modal-cancel').onclick=function(){document.getElementById('tmpl-modal').classList.add('hidden');};
  document.getElementById('btn-tmpl-modal-save').onclick=doSaveTmplFromModal;
  document.getElementById('btn-tmpl-save').onclick=doSaveTmplFromModal;
  document.getElementById('tmpl-selector').onchange=function(){
    setCurrentTmpl(DT,this.value,PL_DEFAULT_FIELDS);
    previewLang=getTmplPreviewLang(DT,PL_DEFAULT_FIELDS);
    renderTmplBar();renderForm();renderPreview();
  };
  document.getElementById('btn-tmpl-new').onclick=function(){
    var name=prompt(lang==='zh'?'请输入新模板名称:':'Enter template name:');
    if(!name)return;
    var newFields={};
    for(var key in PL_DEFAULT_FIELDS){
      if(PL_DEFAULT_FIELDS[key]==='required'){newFields[key]='required';}else{newFields[key]=false;}
    }
    var t=saveNewTmpl(DT,name,newFields,lang==='zh'?'zh':'en',PL_DEFAULT_FIELDS);
    previewLang=t.previewLang||'zh';
    renderTmplBar();renderForm();renderPreview();
    renderTmplModal();
  };
  document.getElementById('btn-tmpl-delete').onclick=function(){
    var current=getCurrentTmpl(DT,PL_DEFAULT_FIELDS);
    if(current.builtIn)return;
    if(!confirm(lang==='zh'?'确定删除模板 "'+current.name+'" 吗？':'Delete template "'+current.name+'"?'))return;
    deleteTmpl(DT,current.id,PL_DEFAULT_FIELDS);
    previewLang=getTmplPreviewLang(DT,PL_DEFAULT_FIELDS);
    renderTmplBar();renderForm();renderPreview();
  };
}
document.getElementById('lang-btn').onclick=function(){lang=lang==='zh'?'en':'zh';setLang(lang);renderAll();};
document.getElementById('theme-btn').onclick=function(){dark=!dark;setTheme(dark);applyTheme();renderAll();};
  injectSpaButton();
  injectBottomCta();
  injectPageFaq();
setupTmplEvents();
document.getElementById('btn-cancel-clear').onclick=function(){showClearConfirm=false;renderClearModal();};
document.getElementById('btn-confirm-clear').onclick=function(){data=getDefaultDoc(DT);saveDocData(DT,data);showClearConfirm=false;renderClearModal();renderForm();renderPreview();};
window._plSet=function(f,v){data[f]=v;saveDocData(DT,data);};
window._plItem=function(idx,f,v){data.items[idx][f]=v;autoCalcItem(DT,data.items[idx]);saveDocData(DT,data);};
window._plAddItem=function(){data.items.push(getEmptyItem(DT));saveDocData(DT,data);renderForm();};
window._plRemoveItem=function(idx){if(data.items.length>1){data.items.splice(idx,1);saveDocData(DT,data);renderForm();}};
window._plRestore=function(id){var snaps=loadSnapshots(DT),s=snaps.find(function(x){return x.id===id;});if(s&&s.data){data=JSON.parse(JSON.stringify(s.data));saveDocData(DT,data);renderAll();}};
window._plDeleteSnap=function(id){deleteSnapshot(DT,id);renderHistory();};window._plClearAllHistory=function(){clearAllSnapshots(DT);renderHistory();};
function esc(str){if(!str)return'';return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fB(t,s){return t+(s?' <span style="font-size:12px;color:var(--text-muted);font-weight:400;">'+s+'</span>':'');}
function lI(l,v,f,p){return '<div><div class="form-label">'+l+'</div><input class="input-field" value="'+esc(v)+'" onchange="window._plSet(\''+f+'\',this.value)" placeholder="'+(p||'')+'"></div>';}
function lID(l,v,f){return '<div><div class="form-label">'+l+'</div><input class="input-field" type="date" value="'+esc(v)+'" onchange="window._plSet(\''+f+'\',this.value)"></div>';}
