  if(isFld('remarks.text'))h+='</div><div style="margin-top:12px;"><div class="form-label">'+(isZh?'装箱备注':'Packing Remarks')+'</div><textarea class="input-field" rows="2" onchange="window._plSet(\'packingRemarks\',this.value)">'+esc(d.packingRemarks)+'</textarea></div>';
  h+='<div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));margin-top:12px;">';
  if(isFld('signature.name'))h+=lI(isZh?'制单人':'Prepared By',d.preparerName,'preparerName','');
  if(isFld('signature.title'))h+=lI(isZh?'职务':'Title',d.preparerTitle,'preparerTitle','');
  if(isFld('signature.date'))h+=lID(isZh?'签名日期':'Signature Date',d.signatureDate,'signatureDate');
  h+='</div></div>';
  document.getElementById('form-container').innerHTML=h;
}

    h+='<div class="address-block"><div class="addr-label">'+tr2('SHIPPER','发货人')+':</div>';

    if(isFld('shipper.shipperAddress')&&d.shipperAddress)h+='<div>'+esc(d.shipperAddress)+'</div>';

  }

    h+='<div class="address-block"><div class="addr-label">'+tr2('CONSIGNEE','收货人')+':</div>';
    if(isFld('consignee.consigneeCompany')&&d.consigneeCompany)h+='<div>'+esc(d.consigneeCompany)+'</div>';
    if(isFld('consignee.consigneeAddress')&&d.consigneeAddress)h+='<div>'+esc(d.consigneeAddress)+'</div>';
    if(isFld('consignee.consigneeName')&&d.consigneeName)h+='<div>'+esc(d.consigneeName)+'</div>';
    h+='</div>';
  }
  h+='</div></div>';
  var leftShipFlds=[
    {key:'shipping.invoiceNo',label:'Invoice No.',labelCn:'发票号',val:d.invoiceNo},
    {key:'shipping.poNo',label:'PO No.',labelCn:'采购单号',val:d.poNo},
    {key:'shipping.contractNo',label:'Contract No.',labelCn:'合同号',val:d.contractNo},
    {key:'shipping.dateOfPacking',label:'Date of Packing',labelCn:'装箱日期',val:d.dateOfPacking},
    {key:'shipping.dateOfExport',label:'Date of Export',labelCn:'出口日期',val:d.dateOfExport}
  ];
  var rightShipFlds=[
    {key:'shipping.shippingMark',label:'Shipping Mark',labelCn:'唛头',val:d.shippingMark},
    {key:'shipping.vessel',label:'Vessel',labelCn:'船名',val:d.vessel},
    {key:'shipping.portOfLoading',label:'Port of Loading',labelCn:'装货港',val:d.portOfLoading},
    {key:'shipping.portOfDischarge',label:'Port of Discharge',labelCn:'卸货港',val:d.portOfDischarge},
    {key:'shipping.containerNo',label:'Container No.',labelCn:'集装箱号',val:d.containerNo},
    {key:'shipping.sealNo',label:'Seal No.',labelCn:'封号',val:d.sealNo}
  ];
  var hasLeft=leftShipFlds.some(function(f){return isFld(f.key);});
  var hasRight=rightShipFlds.some(function(f){return isFld(f.key);});
  if(hasLeft||hasRight){

    leftShipFlds.forEach(function(f){
      if(isFld(f.key))h+='<div class="field-row"><span style="font-weight:bold;min-width:100px;flex-shrink:0;">'+(isZh2?f.labelCn:f.label)+':</span><span class="field-value">'+esc(f.val||'—')+'</span></div>';
    });
    h+='</div><div style="flex:1;">';
    rightShipFlds.forEach(function(f){
      if(isFld(f.key))h+='<div class="field-row"><span style="font-weight:bold;min-width:100px;flex-shrink:0;">'+(isZh2?f.labelCn:f.label)+':</span><span class="field-value">'+esc(f.val||'—')+'</span></div>';
    });
    h+='</div></div>';
  }
  var itemCols=[
    {key:'items.description',label:'DESCRIPTION',labelCn:'描述',width:'12%',field:'description',render:function(v){return v||'—';}},

    {key:'items.numberOfPkgs',label:'PKGS',labelCn:'件数',width:'6%',field:'numberOfPkgs',render:function(v){return v||'—';}},
    {key:'items.typeOfPackaging',label:'PACKAGING',labelCn:'包装类型',width:'5%',field:'typeOfPackaging',render:function(v){return v||'—';}},
    {key:'items.qtyPerPkg',label:'QTY/PKG',labelCn:'每箱数量',width:'4%',field:'qtyPerPkg',render:function(v){return v||'—';}},
    {key:'items.totalQty',label:'TOTAL QTY',labelCn:'总数量',width:'5%',field:'totalQty',render:function(v){return v||'—';}},
    {key:'items.unitOfMeasure',label:'UOM',labelCn:'单位',width:'4%',field:'unitOfMeasure',render:function(v){return v||'—';}},
    {key:'items.netWeightPerPkg',label:'N.W/PKG',labelCn:'单件净重',width:'4%',field:'netWeightPerPkg',render:function(v){return v||'—';}},
    {key:'items.grossWeightPerPkg',label:'G.W/PKG',labelCn:'单件毛重',width:'6%',field:'grossWeightPerPkg',render:function(v){return v||'—';}},
    {key:'items.totalNetWeight',label:'TOTAL N.W',labelCn:'总净重',width:'7%',field:'totalNetWeight',render:function(v){return v||'—';}},
    {key:'items.totalGrossWeight',label:'TOTAL G.W',labelCn:'总毛重',width:'6%',field:'totalGrossWeight',render:function(v){return v||'—';}},
    {key:'items.dimensionL',label:'L (mm)',labelCn:'长(mm)',width:'5%',field:'dimensionL',render:function(v){return v||'—';}},
    {key:'items.dimensionW',label:'W (mm)',labelCn:'宽(mm)',width:'5%',field:'dimensionW',render:function(v){return v||'—';}},
    {key:'items.dimensionH',label:'H (mm)',labelCn:'高(mm)',width:'5%',field:'dimensionH',render:function(v){return v||'—';}},
    {key:'items.measurementCBM',label:'CBM',labelCn:'体积',width:'8%',field:'measurementCBM',render:function(v){return v||'—';}}
  ];
  var visCols=itemCols.filter(function(c){return isFld(c.key);});
  h+='<table class="items"><thead><tr><th style="width:5%;">'+tr2('NO.','序号')+'</th>';
  visCols.forEach(function(c){h+='<th style="width:'+c.width+';">'+(isZh2?c.labelCn:c.label)+'</th>';});
  h+='</tr></thead><tbody>';
  d.items.forEach(function(it,idx){
    h+='<tr><td class="text-center">'+(idx+1)+'</td>';
    visCols.forEach(function(c){
      var cls='text-center';
      if(c.field==='description')cls='whitespace-pre-wrap';
      h+='<td class="'+cls+'">'+c.render(it[c.field])+'</td>';
    });
    h+='</tr>';
  });
  var hasTotals=isFld('totals.totalPkgs')||isFld('totals.totalNetWeight')||isFld('totals.totalGrossWeight')||isFld('totals.totalMeasurement');
  if(hasTotals){
    h+='<tr class="total-row"><td></td>';
    var _labelPlaced=false;
    visCols.forEach(function(c){
      if(!_labelPlaced&&c.field==='description'){
        h+='<td class="text-left font-bold">'+tr2('TOTAL','合计')+':</td>';
        _labelPlaced=true;
      }else if(c.field==='numberOfPkgs'){
        h+='<td class="font-bold">'+(d.totalPkgs||totalPkgsCalc||'—')+'</td>';
      }else if(c.field==='totalNetWeight'){

      }else if(c.field==='totalGrossWeight'){
        h+='<td class="font-bold">'+(d.totalGrossWeight||totalGrossW.toFixed(2))+'</td>';
      }else if(c.field==='measurementCBM'){
        h+='<td class="font-bold">'+(d.totalMeasurement||totalMeasCalc||'—')+'</td>';
      }else{
        h+='<td></td>';
      }

    h+='</tr>';
  }
  h+='</tbody></table>';
  if(isFld('remarks.text')&&d.packingRemarks){
    h+='<div class="remarks-block" style="margin-top:10px;font-size:12px;font-style:italic;">';

function renderHistory(){
  var tr=I18N[lang],snaps=loadSnapshots(DT),search=(document.getElementById('history-search').value||'').toLowerCase();
  if(search)snaps=snaps.filter(function(s){return(s.label||'').toLowerCase().indexOf(search)!==-1||(s.ref||'').toLowerCase().indexOf(search)!==-1;});
  var h='';if(snaps.length===0){h+='<div class="history-empty">'+svg('Clock',48)+'<p>'+tr.noHistory+'</p></div>';}
  else{h+='<div style="margin-bottom:12px;font-size:13px;color:var(--text-muted);">'+snaps.length+' '+tr.records+'</div><div class="history-list">';
  snaps.forEach(function(s){h+='<div class="history-item"><div class="history-item-info"><div class="history-item-label">'+esc(s.label||'draft')+'</div>';
  h+='<div class="history-item-ref">'+esc(s.ref||'')+' — '+formatDateTime(s.exportedAt)+'</div></div><div class="history-item-actions">';
  h+='<button class="btn btn-secondary btn-sm" onclick="window._plRestore(\''+s.id+'\')">'+tr.restore+'</button>';
  h+='<button class="btn btn-danger btn-sm" onclick="window._plDeleteSnap(\''+s.id+'\')">'+tr.delete+'</button></div></div>';});
  h+='</div><div style="margin-top:16px;"><button class="btn btn-secondary btn-sm" onclick="window._plClearAllHistory()">'+tr.clearAll+'</button></div>';}
  document.getElementById('history-container').innerHTML=h;document.getElementById('history-search').oninput=function(){renderHistory();};
}

window._plDeleteSnap=function(id){deleteSnapshot(DT,id);renderHistory();};window._plClearAllHistory=function(){clearAllSnapshots(DT);renderHistory();};
