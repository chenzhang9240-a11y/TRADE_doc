    h+='</div></div>';

  // 6. Special Instructions

  else{h+='<div style="margin-bottom:12px;font-size:13px;color:var(--text-muted);">'+snaps.length+' '+tr.records+'</div><div class="history-list">';
  snaps.forEach(function(s){h+='<div class="history-item"><div class="history-item-info"><div class="history-item-label">'+esc(s.label||'draft')+'</div>';
  h+='<div class="history-item-ref">'+esc(s.ref||'')+' — '+formatDateTime(s.exportedAt)+'</div></div><div class="history-item-actions">';
  h+='<button class="btn btn-secondary btn-sm" onclick="window._sliRestore(\''+s.id+'\')">'+tr.restore+'</button>';
  h+='<button class="btn btn-danger btn-sm" onclick="window._sliDeleteSnap(\''+s.id+'\')">'+tr.delete+'</button></div></div>';});
  h+='</div><div style="margin-top:16px;"><button class="btn btn-secondary btn-sm" onclick="window._sliClearAllHistory()">'+tr.clearAll+'</button></div>';}
  document.getElementById('history-container').innerHTML=h;document.getElementById('history-search').oninput=function(){renderHistory();};

function _sliCalcTotals(){
  var d=data;
  // Sea totals
  var sd=d.sea,sv=0,sw=0,sp=0,svo=0;
  (sd.items||[]).forEach(function(it){
    sv+=parseFloat(it.value)||0;sw+=parseFloat(it.weight)||0;
    sp+=parseFloat(it.quantity)||0;svo+=parseFloat(it.volume)||0;
  });
  sd.totalValue=sv>0?sv.toFixed(2):'';sd.totalWeight=sw>0?sw.toFixed(2)+' KG':'';
  sd.totalPkgs=sp>0?String(sp):'';sd.totalVolume=svo>0?svo.toFixed(2)+' CBM':'';
  // Air totals
  var ad=d.air,av=0,aw=0,ap=0,avo=0;
  (ad.items||[]).forEach(function(it){
    // Auto-calc volume from L/W/H if available
    var l=parseFloat(it.length)||0,w=parseFloat(it.width)||0,h=parseFloat(it.height)||0,q=parseFloat(it.quantity)||0;
    if(l&&w&&h&&q){it.volume=((l*w*h/1000000000)*q).toFixed(4);}
    av+=parseFloat(it.value)||0;aw+=parseFloat(it.weight)||0;
    ap+=parseFloat(it.quantity)||0;avo+=parseFloat(it.volume)||0;
  });
  ad.totalValue=av>0?av.toFixed(2)+' '+(ad.currency||''):'';ad.totalGrossWeight=aw>0?aw.toFixed(2)+' KG':'';
  ad.totalPkgs=ap>0?String(ap):'';ad.totalVolume=avo>0?avo.toFixed(3)+' CBM':'';
  // Volume weight = volume * 167, Chargeable weight = max(gross weight, volume weight)
  if(avo>0){ad.volumeWeight=(avo*167).toFixed(2)+' KG';}
  else{ad.volumeWeight='';}
  var gw=parseFloat(aw)||0,vw=avo*167||0;
  if(gw>0||vw>0){ad.chargeableWeight=Math.max(gw,vw).toFixed(2)+' KG';}
  else{ad.chargeableWeight='';}
  saveDocData(DT,data);
}
