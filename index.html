<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade OS - Document Workbench</title>
<meta name="description" content="Trade OS is a free open-source trade document generator supporting 19 document types, bilingual, A4 landscape PDF export.">
<link rel="canonical" href="http://tradekit.treedeep.cn/index.html">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<script src="html2pdf.bundle.min.js"></script>
</head>
<body>
<div id="app"></div>
<script>
var GROUP_DOC = ['commercial_invoice','packing_list','bill_of_lading','trade_contract','commercial_quotation','commercial_packing_list','cost_estimation','proforma_invoice','certificate_of_origin'];
var GROUP_UTIL = ['currency_converter','invoice_number','payment_calculator','shipping_mark','shipper_letter_instruction','customs_declaration','inspection_certificate','fumigation_certificate','insurance_policy','beneficiary_certificate'];
var TOOL_IDS = {
  commercial_invoice:'INVOICE', packing_list:'PACKING', bill_of_lading:'B/L',
  trade_contract:'CONTRACT', commercial_quotation:'QUOTE',
  commercial_packing_list:'CPL', cost_estimation:'COST',
  certificate_of_origin:'C/O', proforma_invoice:'PI',
  beneficiary_certificate:'BENEF', currency_converter:'CCY',
  invoice_number:'GEN', payment_calculator:'CALC',
  shipping_mark:'MARK', shipper_letter_instruction:'SLI',
  customs_declaration:'CUSTOM', inspection_certificate:'INSP',
  fumigation_certificate:'FUMI', insurance_policy:'INS'
};
var TOOL_ICONS = {
  commercial_invoice:'\ud83d\udcc4', packing_list:'\ud83d\udce6', bill_of_lading:'\ud83d\udea2',
  trade_contract:'\ud83d\udcdd', commercial_quotation:'\ud83d\udcb0',
  commercial_packing_list:'\ud83d\udccb', cost_estimation:'\ud83d\udcca',
  certificate_of_origin:'\ud83c\udff7\ufe0f', proforma_invoice:'\ud83d\udcd1',
  beneficiary_certificate:'\ud83d\udee1\ufe0f', currency_converter:'\ud83d\udcb1',
  invoice_number:'\ud83d\udd22', payment_calculator:'\u23f1',
  shipping_mark:'\ud83c\udff7', shipper_letter_instruction:'\u2709\ufe0f',
  customs_declaration:'\ud83d\udcc4', inspection_certificate:'\ud83d\udd0d',
  fumigation_certificate:'\ud83d\udd2c', insurance_policy:'\ud83d\udcde'
};

function t(key) { var l = getLang(); return (I18N[l] && I18N[l][key]) || key; }

function renderCard(dt) {
  var meta = DOC_META[dt];
  if (!meta) return '';
  var isZh = getLang() === 'zh';
  return '<a class="tool-card" href="' + meta.page + '">'
    + '<div class="tc-icon">' + (TOOL_ICONS[dt] || '\ud83d\udcc4') + '</div>'
    + '<div class="tc-id">' + (TOOL_IDS[dt] || dt.toUpperCase()) + '</div>'
    + '<div class="tc-name">' + (isZh ? meta.titleZh : meta.title) + '</div>'
    + '<div class="tc-desc">' + (isZh ? meta.title : meta.titleZh) + '</div></a>';
}

function renderGrid(group) {
  var h = '<div class="tools-grid">';
  group.forEach(function(dt) { h += renderCard(dt); });
  return h + '</div>';
}

function renderRecentDocs() {
  var docs = getRecentDocuments(6);
  if (!docs.length) return '<div class="doc-row" style="justify-content:center;color:var(--text-muted);font-size:0.82rem;padding:20px">No records yet.</div>';
  return docs.map(function(d) {
    return '<div class="doc-row" onclick="window.location.href=' + "'" + d.page + "'" + '">'
      + '<div class="doc-icon">' + (TOOL_ICONS[d.dt] || '\ud83d\udcc4') + '</div>'
      + '<div class="doc-info"><div class="doc-name">' + d.title + (d.ref ? ' — ' + d.ref : '') + '</div>'
      + '<div class="doc-meta">' + d.summary + '</div></div>'
      + '<div class="doc-time">' + getTimeAgo(d.updatedAt) + '</div></div>';
  }).join('');
}

function render() {
  var stats = getDashboardStats();
  var isZh = getLang() === 'zh';
  var h = '';

  // Nav
  h += '<nav class="global-nav">';
  h += '<div class="nav-left"><a href="index.html" class="logo">TRADE_OS v1.0</a></div>';
  h += '<div class="nav-right">';
  h += '<a href="#" class="nav-item">' + t('sectionDoc') + '</a>';
  h += '<a href="#" class="nav-item">' + t('sectionUtil') + '</a>';
  h += '<span class="nav-status">SYS OK</span></div></nav>';

  h += '<div class="container">';

  // Hero
  h += '<div class="hero">';
  h += '<div class="hero-left"><h1><span class="mono">TRADE_OS</span> &middot; '
    + (isZh ? '\u8d38\u6613\u5355\u8bc1\u5de5\u4f5c\u53f0' : 'Trade Document Workbench') + '</h1>';
  h += '<div class="subtitle">' + (isZh ? '19 \u79cd\u56fd\u9645\u8d38\u6613\u5355\u8bc1 \u00b7 \u672c\u5730\u6570\u636e \u00b7 PDF / Excel \u5bfc\u51fa' : '19 trade documents / Local data / PDF & Excel export') + '</div></div>';
  h += '<div class="hero-right">';
  h += '<div class="quick-stat">' + (isZh ? '\u672c\u6708\u751f\u6210' : 'Monthly') + ' <span>' + stats.monthDocCount + '</span></div>';
  h += '<div class="quick-stat">' + (isZh ? '\u6a21\u677f' : 'Templates') + ' <span>' + stats.templateCount + '</span></div></div></div>';

  // AI Bar
  h += '<div class="ai-bar" id="ai-bar">';
  h += '<span class="ai-cursor">&gt;_</span>';
  h += '<input class="ai-input" id="ai-input" type="text" placeholder="' + (isZh ? '\u63cf\u8ff0\u4f60\u7684\u5355\u8bc1\u9700\u6c42... \u4f8b\u5982: \u751f\u6210\u4e00\u4efd\u4ece\u4e0a\u6d77\u5230\u6d1b\u6749\u77f6\u7684\u6d77\u8fd0\u63d0\u5355' : 'Describe your document... e.g. Create a Bill of Lading from Shanghai to LA') + '">';
  h += '<span class="ai-hint" id="ai-hint" onclick="var v=document.getElementById(' + "'ai-input'" + ');if(v)handleAiCommand(v.value)">\u23c5 ' + (isZh ? '\u751f\u6210' : 'Go') + '</span></div>';

  // Stats
  h += '<div class="section-label">// STATS</div>';
  h += '<div class="stats-row">';
  h += '<div class="stat-card"><div class="stat-icon">\ud83d\udce6</div><div class="stat-value">' + stats.monthDocCount + '</div><div class="stat-label">' + (isZh ? '\u672c\u6708\u751f\u6210\u5355\u636e' : 'MONTHLY DOCS') + '</div></div>';
  h += '<div class="stat-card"><div class="stat-icon">\ud83d\udccb</div><div class="stat-value">' + stats.templateCount + '</div><div class="stat-label">' + (isZh ? '\u5df2\u4fdd\u5b58\u6a21\u677f' : 'TEMPLATES') + '</div></div>';
  h += '<div class="stat-card"><div class="stat-icon">\ud83d\udce4</div><div class="stat-value">' + stats.monthExportCount + '</div><div class="stat-label">' + (isZh ? '\u672c\u6708\u5bfc\u51fa' : 'EXPORTS') + '</div></div>';
  h += '<div class="stat-card"><div class="stat-icon">\ud83d\udd12</div><div class="stat-value">100%</div><div class="stat-label">' + (isZh ? '\u672c\u5730\u5b58\u50a8' : 'LOCAL DATA') + '</div></div></div>';

  // Recent
  h += '<div class="section-label">// RECENT</div>';
  h += '<div class="mid-row">';
  h += '<div class="panel"><div class="panel-title">' + (isZh ? '\u6700\u8fd1\u6253\u5f00\u7684\u6587\u6863' : 'RECENT DOCUMENTS') + ' <span class="count">' + stats.docCount + ' ' + (isZh ? '\u6761\u8bb0\u5f55' : 'records') + '</span></div>'
    + renderRecentDocs() + '</div>';
  h += '<div class="panel"><div class="panel-title">' + (isZh ? '\u5feb\u901f\u64cd\u4f5c' : 'QUICK ACTIONS') + '</div>'
    + '<div class="quick-actions">'
    + '<a class="quick-btn" href="commercial-invoice.html"><span class="qb-icon">\ud83d\udcc4</span>' + (isZh ? '\u65b0\u5efa\u5546\u4e1a\u53d1\u7968' : 'New Invoice') + '</a>'
    + '<a class="quick-btn" href="packing-list.html"><span class="qb-icon">\ud83d\udce6</span>' + (isZh ? '\u65b0\u5efa\u88c5\u7bb1\u5355' : 'New Packing List') + '</a>'
    + '<a class="quick-btn" href="bill-of-lading.html"><span class="qb-icon">\ud83d\udea2</span>' + (isZh ? '\u65b0\u5efa\u63d0\u5355' : 'New Bill of Lading') + '</a>'
    + '<a class="quick-btn" onclick="alert("Use Settings > Backup to export data")"><span class="qb-icon">\ud83d\udce4</span>' + (isZh ? '\u5bfc\u51fa\u6570\u636e' : 'Export Data') + '</a>'
    + '</div></div></div>';

  // Tools grid 1
  h += '<div class="tools-section"><div class="section-header">'
    + '<span class="title">// ' + (isZh ? '\u5355\u636e\u751f\u6210' : 'DOCUMENTS') + '</span></div>';
  h += renderGrid(GROUP_DOC) + '</div>';

  // Tools grid 2
  h += '<div class="tools-section"><div class="section-header">'
    + '<span class="title">// ' + (isZh ? '\u5b9e\u7528\u5de5\u5177\u4e0e\u8ba4\u8bc1' : 'UTILITIES & CERTIFICATION') + '</span></div>';
  h += renderGrid(GROUP_UTIL) + '</div>';

  // Footer
  h += '<footer class="page-footer">'
    + '<div class="footer-left">' + (isZh ? '\u6240\u6709\u6570\u636e\u4ec5\u5b58\u50a8\u5728\u6d4f\u89c8\u5668\u672c\u5730\uff0c\u4e0d\u4f1a\u4e0a\u4f20\u81f3\u4efb\u4f55\u670d\u52a1\u5668\u3002' : 'All data stored locally. No upload.') + '</div>'
    + '<div class="footer-right">MIT License &middot; v1.0</div></footer>';

  h += '</div>';

  document.getElementById('app').innerHTML = h;

  var aiInput = document.getElementById('ai-input');
  if (aiInput) {
    aiInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleAiCommand(this.value.trim());
    });
  }
}

function toggleLang() {
  var l = localStorage.getItem('app_lang');
  localStorage.setItem('app_lang', l === 'en' ? 'zh' : 'en');
  render();
}

document.addEventListener('DOMContentLoaded', function() {
  applyTheme();
  render();
});

</script>
<!-- GoatCounter -->
<script data-goatcounter="https://tradekit.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
