// ===== Template Helpers =====
function isFld(key) {
  return isFieldVisible(DT, key, CI_DEFAULT_FIELDS);
}
function isFldR(key) {
  return isFieldRequired(DT, key, CI_DEFAULT_FIELDS);
}

var dark = isDark();
var previewLang = getTmplPreviewLang(DT, CI_DEFAULT_FIELDS);
var data = null;
var showClearConfirm = false;

// ===== Initialize =====
function init() {
  applyTheme();
  ensureTmplData(DT, CI_DEFAULT_FIELDS);
  migrateTmplData(DT, CI_DEFAULT_FIELDS);
  injectSpaButton();
  injectBottomCta();
  injectPageFaq();
  var saved = loadDocData(DT);
  
  var aiPrefill = loadAiPrefill(DT);
  if (aiPrefill && !saved) {
    var defaults = getDefaultDoc(DT);
    data = mergeAiFields(defaults, aiPrefill.fields);
    saveDocData(DT, data);
    localStorage.removeItem(getUserId() + '_ai_prefill_' + DT);
    showAiSuggestion(aiPrefill.suggestion);
  } else { data = saved ? saved : getDefaultDoc(DT); }
  renderAll();
  
  setupTmplEvents();
}

// ===== Rendering (shared functions in common.js) =====

// ===== Form Rendering =====
function renderForm() {
  var tr = I18N[lang];
  var isZh = lang === 'zh';

  // Load sample button
  document.getElementById('btn-load-sample').textContent = tr.loadSample;
  document.getElementById('btn-clear').textContent = tr.clear;
  document.getElementById('btn-switch-preview').textContent = tr.preview;
  document.getElementById('btn-pdf').textContent = tr.exportPdf;
  document.getElementById('btn-excel').textContent = tr.exportExcel;
  document.getElementById('btn-back-edit').textContent = tr.backEdit;
  document.getElementById('btn-preview-lang').textContent = previewLang === 'en' ? 'Switch to 中文' : 'Switch to English';
  document.getElementById('btn-pdf-preview').textContent = tr.exportPdf;
  document.getElementById('btn-excel-preview').textContent = tr.exportExcel;
  document.getElementById('btn-print').textContent = tr.print;
  document.getElementById('history-search').placeholder = tr.searchPlaceholder;

  // Action bar button handlers
  document.getElementById('btn-load-sample').onclick = loadSample;
  document.getElementById('btn-clear').onclick = function() { showClearConfirm = true; renderClearModal(); };
  document.getElementById('btn-switch-preview').onclick = function() { switchTab('preview'); renderPreview(); };
  document.getElementById('btn-back-edit').onclick = function() { switchTab('edit'); };
  document.getElementById('btn-pdf').onclick = function() { doExportPdf(DT, data, 'preview-content'); };
  document.getElementById('btn-excel').onclick = function() { doExportExcel(DT, data); };
  document.getElementById('btn-pdf-preview').onclick = function() { doExportPdf(DT, data, 'preview-content'); };
  document.getElementById('btn-excel-preview').onclick = function() { doExportExcel(DT, data); };
  document.getElementById('btn-preview-lang').onclick = function() { previewLang = previewLang === 'en' ? 'zh' : 'en'; renderPreview(); };
  document.getElementById('btn-print').onclick = function() { window.print(); };

  var isZh = lang === 'zh';
  var d = data;
  var subtotal = d.items.reduce(function(s, it) { return s + (parseFloat(it.totalValue) || 0); }, 0);
  var totalPkgs = d.items.reduce(function(s, it) { return s + (parseFloat(it.noOfPkgs) || 0); }, 0);
  var totalWeight = d.items.reduce(function(s, it) { return s + (parseFloat(it.weight) || 0); }, 0);

  function set(field, value) {
    data[field] = value;
    saveDocData(DT, data);
  }

  function setItem(idx, field, value) {
    data.items[idx][field] = value;
    autoCalcItem(DT, data.items[idx]);
    saveDocData(DT, data);
    renderForm();
  }

  var html = '';

  // Logo Upload
  if (isFld('logo')) {
  html += '<div class="section-card">';
  html += '<h3>' + (isZh ? '企业信息 & Logo' : 'Company Info & Logo') + '</h3>';
  html += '<div class="logo-upload">';
  html += '  <div class="logo-upload-label">' + tr.logoLabel + '</div>';
  html += '  <div style="display:flex;align-items:center;gap:12px;">';
  if (d.logo) {
    html += '  <div class="logo-preview-wrap">';
    html += '    <img src="' + d.logo + '" alt="logo">';
    html += '    <button class="logo-remove" onclick="window._ciRemoveLogo()">X</button>';
    html += '  </div>';
  } else {
    html += '  <label class="logo-upload-btn">';
    html += '    ' + svg('Upload', 14);
    html += '    <span>' + tr.uploadLogo + '</span>';
    html += '    <input type="file" accept="image/*" onchange="window._ciLogoUpload(event)">';
    html += '  </label>';
  }
  html += '  <span class="logo-upload-hint">' + tr.logoHint + '</span>';
  html += '  </div>';
  html += '</div>';
  }

  // Shipper / Exporter
  if (isFld('shipper.company') || isFld('shipper.address') || isFld('shipper.name') || isFld('shipper.phone') || isFld('shipper.taxId')) {
  html += '<div class="section-card">';
  html += '<h3>' + (isZh ? 'Shipper / Exporter / 发货人/出口商' : 'Shipper / Exporter') + '</h3>';
  html += '<div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));">';
  if (isFld('shipper.company')) {
  html += '<div class="form-label">' + (isZh ? '公司' : 'Company') + ' <span style="color:#dc2626;">*</span></div>';
  html += '<input class="input-field" value="' + esc(d.shipperName) + '" onchange="window._ciSet(\'shipperName\',this.value)" placeholder="' + (isZh ? '公司名称' : 'Company name') + '">';
  }
  if (isFld('shipper.address')) {
  html += '<div class="form-label">' + (isZh ? '地址' : 'Address') + ' <span style="color:#dc2626;">*</span></div>';
  html += '<textarea class="input-field" rows="2" onchange="window._ciSet(\'shipperAddress\',this.value)" placeholder="' + (isZh ? '完整地址' : 'Full address') + '">' + esc(d.shipperAddress) + '</textarea>';
  }
  if (isFld('shipper.name')) {
  html += '<div class="form-label">' + (isZh ? '联系人' : 'Contact Person') + '</div>';
  html += '<input class="input-field" value="' + esc(d.shipperName) + '" onchange="window._ciSet(\'shipperName\',this.value)" placeholder="' + (isZh ? '联系人姓名' : 'Contact name') + '">';
  }
  if (isFld('shipper.phone')) {
  html += '<div class="form-label">' + (isZh ? '电话' : 'Phone') + '</div>';
  html += '<input class="input-field" type="tel" value="' + esc(d.shipperPhone) + '" onchange="window._ciSet(\'shipperPhone\',this.value)" placeholder="+86">';
  }
  if (isFld('shipper.taxId')) {
  html += '<div class="form-label">' + (isZh ? '税号' : 'Tax ID') + '</div>';
  html += '<input class="input-field" value="' + esc(d.shipperTaxId) + '" onchange="window._ciSet(\'shipperTaxId\',this.value)" placeholder="VAT / GST / EIN">';
  }
  html += '</div>';
  html += '</div>';
  }

  // Consignee
  if (isFld('consignee.company') || isFld('consignee.address') || isFld('consignee.name') || isFld('consignee.phone') || isFld('consignee.taxId')) {
  html += '<div class="section-card" style="margin-top:16px;">';
  html += '<h3>' + (isZh ? 'Consignee / 收货人' : 'Consignee') + '</h3>';

// ===== Number to Words for SAY TOTAL =====
var CURRENCY_WORDS = {
  'USD': 'U.S. DOLLARS', 'EUR': 'EUROS', 'GBP': 'POUNDS STERLING', 'JPY': 'JAPANESE YEN',
  'CNY': 'CHINESE YUAN', 'HKD': 'HONG KONG DOLLARS', 'AUD': 'AUSTRALIAN DOLLARS',
  'CAD': 'CANADIAN DOLLARS', 'SGD': 'SINGAPORE DOLLARS', 'KRW': 'KOREAN WON',
  'INR': 'INDIAN RUPEES', 'RUB': 'RUSSIAN RUBLES', 'BRL': 'BRAZILIAN REALS',
  'TWD': 'TAIWAN DOLLARS', 'CHF': 'SWISS FRANCS', 'SEK': 'SWEDISH KRONA',
  'NOK': 'NORWEGIAN KRONE', 'DKK': 'DANISH KRONE', 'THB': 'THAI BAHT',
  'MXN': 'MEXICAN PESOS', 'NZD': 'NEW ZEALAND DOLLARS', 'ZAR': 'SOUTH AFRICAN RAND',
  'MYR': 'MALAYSIAN RINGGIT', 'PHP': 'PHILIPPINE PESOS', 'IDR': 'INDONESIAN RUPIAH',
  'VND': 'VIETNAMESE DONG', 'AED': 'UAE DIRHAM', 'SAR': 'SAUDI RIYAL',
  'TRY': 'TURKISH LIRA', 'PLN': 'POLISH ZLOTY'
};
function numToWords(n) {
  if (n === null || n === undefined) return '';
  n = parseFloat(n);
  if (isNaN(n) || n === 0) return '';
  n = Math.round(n * 100) / 100;
  var ones = ['','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE',
    'TEN','ELEVEN','TWELVE','THIRTEEN','FOURTEEN','FIFTEEN','SIXTEEN',
    'SEVENTEEN','EIGHTEEN','NINETEEN'];
  var tens = ['','','TWENTY','THIRTY','FORTY','FIFTY','SIXTY','SEVENTY','EIGHTY','NINETY'];
  function convert(m) {
    if (m === 0) return '';
    var s = '';
    if (m >= 100) { s += ones[Math.floor(m / 100)] + ' HUNDRED'; m %= 100; if (m > 0) s += ' AND '; }
    if (m >= 20) { s += tens[Math.floor(m / 10)]; m %= 10; if (m > 0) s += ' ' + ones[m]; }
    else if (m > 0) { s += ones[m]; }
    return s;
  }
  var intPart = Math.floor(n);
  var decPart = Math.round((n - intPart) * 100);
  var words = '';
  var b = Math.floor(intPart / 1000000000);
  var m = Math.floor((intPart % 1000000000) / 1000000);
  var t = Math.floor((intPart % 1000000) / 1000);
  var h = intPart % 1000;
  if (b) words += convert(b) + ' BILLION ';
  if (m) words += convert(m) + ' MILLION ';
  if (t) words += convert(t) + ' THOUSAND ';
  if (h) words += convert(h);
  words = words.trim().replace(/\s+/g, ' ');
  if (decPart > 0) words += ' AND CENTS ' + convert(decPart);
  return words;
}

    { key: 'items.hsCode', label: 'HS CODE', labelCn: 'HS编码', width: '8%', field: 'hsCode', render: function(v) { return v || '—'; } },
    { key: 'items.qty', label: 'QTY', labelCn: '数量', width: '6%', field: 'qty', render: function(v) { return v || '—'; } },
    { key: 'items.unit', label: 'UNIT OF MEASURE', labelCn: '单位', width: '6%', field: 'unitOfMeasure', render: function(v) { return v || '—'; } },
    { key: 'items.weight', label: 'WEIGHT (KG)', labelCn: '重量(KG)', width: '6%', field: 'weight', render: function(v) { return v || '—'; } },
    { key: 'items.unitValue', label: 'UNIT VALUE (' + d.currency + ')', labelCn: '单价', width: '10%', field: 'unitValue', render: function(v) { return v ? parseFloat(v).toFixed(2) : '—'; } },
    { key: 'items.total', label: 'TOTAL VALUE (' + d.currency + ')', labelCn: '总价', width: '10%', field: 'totalValue', render: function(v) { return v ? parseFloat(v).toFixed(2) : '—'; } }
  ];
  var visCols = itemCols.filter(function(c) { return isFld(c.key); });

  if (visCols.length > 0) {
  html += '<table class="items"><thead><tr><th style="width:4%;">' + tr('ITEM', '项号') + '</th>';
  visCols.forEach(function(c) { html += '<th style="width:' + c.width + ';">' + tr(c.label, c.labelCn) + '</th>'; });
  html += '</tr></thead><tbody>';
  d.items.forEach(function(item, idx) {
    html += '<tr><td class="text-center">' + (idx + 1) + '</td>';
    visCols.forEach(function(c) {
      var val = c.render(item[c.field]);
      var align = c.field === 'description' ? ' class="text-left"' : (c.field === 'unitValue' || c.field === 'totalValue' ? ' class="text-right"' : '');
      html += '<td' + align + '>' + val + '</td>';
    });
    html += '</tr>';
  });
  // Totals row — each column mapped to same position as header
  if (isFld('items.pkgs') || isFld('items.qty') || isFld('items.weight') || isFld('items.unitValue') || isFld('items.total')) {
    html += '<tr class="total-row">';
    html += '<td></td>'; // ITEM # column — empty
    visCols.forEach(function(c, idx) {
      if (idx === 0) {
        // First data column (MARKS area) — show TOTAL: left-aligned
        html += '<td class="text-left font-bold">' + tr('TOTAL', '合计') + ':</td>';
      } else if (c.field === 'noOfPkgs') {
        html += '<td class="font-bold">' + totalPkgs + '</td>';
      } else if (c.field === 'qty') {
        html += '<td class="font-bold">' + totalQty + '</td>';
      } else if (c.field === 'weight') {
        html += '<td class="font-bold">' + (displayTotalWeight || '—') + '</td>';
      } else if (c.field === 'unitValue') {
        html += '<td></td>';
      } else if (c.field === 'totalValue') {
        html += '<td class="text-right font-bold">' + (d.totalInvoiceValue || invoiceTotal.toFixed(2)) + ' ' + d.currency + '</td>';
      } else {
        html += '<td></td>';
      }
    });
    html += '</tr>';
  }
  html += '</tbody></table>';

  // SAY TOTAL — auto-generated from currency and total amount
  var sayTotalAmount = parseFloat(d.totalInvoiceValue || invoiceTotal);
  var sayCurrency = d.currency || '';
  if (sayTotalAmount > 0 && sayCurrency) {
    var currName = CURRENCY_WORDS[sayCurrency] || sayCurrency + ' DOLLARS';
    var words = numToWords(sayTotalAmount);
    if (words) {
      html += '<div class="total-words">SAY TOTAL: ' + currName + ' ' + words + ' ONLY.</div>';
    }
  }
  }

  // Declaration & Signature — right-aligned matching reference format
  if (isFld('declaration.text') || isFld('declaration.footerNote') || isFld('declaration.signatureName') || isFld('declaration.title') || isFld('declaration.date')) {
  if (isFld('declaration.text')) {
  html += '<div class="certify-text">' + esc(d.declaration) + '</div>';
  html += '<div class="certify-text" style="margin-top:2px;font-weight:normal;">' + tr('I declare that the information on this invoice is true and correct.', '本人声明本发票所载信息真实无误。') + '</div>';
  }
  if (isFld('declaration.signatureName') || isFld('declaration.title') || isFld('declaration.date')) {
  html += '<div class="signature-block">';
  if (isFld('declaration.signatureName')) html += esc(d.signatureName || '—') + '<br>';
  if (isFld('declaration.title')) html += esc(d.signatureTitle || '—') + '<br>';
  if (isFld('declaration.date')) html += esc(d.signatureDate || '—') + '<br>';
  html += '(' + tr('Authorized Signature &amp; Stamp', '授权签名 &amp; 盖章') + ')';
  html += '</div>';
  }
  if (isFld('declaration.footerNote') && d.footerNote) {
    html += '<div class="text-xs text-gray-500 text-center" style="margin-top:12px;">' + esc(d.footerNote) + '</div>';
  }
  }

  html += '</div>';
  document.getElementById('preview-container').innerHTML = html;
}

// ===== History =====
function renderHistory() {
  var tr = I18N[lang];
  var snaps = loadSnapshots(DT);
  var search = (document.getElementById('history-search').value || '').toLowerCase();
  if (search) {
    snaps = snaps.filter(function(s) {
      return (s.label || '').toLowerCase().indexOf(search) !== -1 ||
             (s.ref || '').toLowerCase().indexOf(search) !== -1 ||
             (s.exportedAt || '').toLowerCase().indexOf(search) !== -1;
    });
  }

  var html = '';
  if (snaps.length === 0) {
    html += '<div class="history-empty">';
    html += svg('Clock', 48);
    html += '<p>' + tr.noHistory + '</p>';
    html += '</div>';
  } else {
    html += '<div style="margin-bottom:12px;font-size:13px;color:var(--text-muted);">' + snaps.length + ' ' + tr.records + '</div>';
    html += '<div class="history-list">';
    snaps.forEach(function(s) {
      html += '<div class="history-item">';
      html += '<div class="history-item-info">';
      html += '<div class="history-item-label">' + esc(s.label || 'draft') + '</div>';
      html += '<div class="history-item-ref">' + esc(s.ref || '') + ' — ' + formatDateTime(s.exportedAt) + '</div>';
      html += '</div>';
      html += '<div class="history-item-actions">';
      html += '<button class="btn btn-secondary btn-sm" onclick="window._ciRestore(\'' + s.id + '\')">' + tr.restore + '</button>';
      html += '<button class="btn btn-danger btn-sm" onclick="window._ciDeleteSnap(\'' + s.id + '\')">' + tr.delete + '</button>';
      html += '</div></div>';
    });
    html += '</div>';
    html += '<div style="margin-top:16px;"><button class="btn btn-secondary btn-sm" onclick="window._ciClearAllHistory()">' + tr.clearAll + '</button></div>';
  }
  document.getElementById('history-container').innerHTML = html;

  // Search handler
  document.getElementById('history-search').oninput = function() { renderHistory(); };
}

// ===== Event Handlers =====
document.getElementById('lang-btn').onclick = function() {
  lang = lang === 'zh' ? 'en' : 'zh';
  setLang(lang);
  renderAll();
};
document.getElementById('theme-btn').onclick = function() {
  dark = !dark;
  setTheme(dark);
  applyTheme();
  renderAll();
};
document.getElementById('btn-cancel-clear').onclick = function() { showClearConfirm = false; renderClearModal(); };
document.getElementById('btn-confirm-clear').onclick = function() {
  data = getDefaultDoc(DT);
  saveDocData(DT, data);
  showClearConfirm = false;
  renderClearModal();
  renderForm();
  renderPreview();
};

// ===== Window-level helpers for inline event handlers =====
window._ciSet = function(field, value) {
  data[field] = value;
  saveDocData(DT, data);
};
window._ciItem = function(idx, field, value) {
  data.items[idx][field] = value;
  autoCalcItem(DT, data.items[idx]);
  saveDocData(DT, data);
  renderForm();
};
window._ciAddItem = function() {
  data.items.push(getEmptyItem(DT));
  saveDocData(DT, data);
  renderForm();
};
window._ciRemoveItem = function(idx) {
  if (data.items.length > 1) {
    data.items.splice(idx, 1);
    saveDocData(DT, data);
    renderForm();
  }
};
window._ciRestore = function(id) {
  var snaps = loadSnapshots(DT);
  var snap = snaps.find(function(s) { return s.id === id; });
  if (snap && snap.data) {
    data = JSON.parse(JSON.stringify(snap.data));
    saveDocData(DT, data);
    renderAll();
  }
};
window._ciDeleteSnap = function(id) {
  deleteSnapshot(DT, id);
  renderHistory();
};
window._ciClearAllHistory = function() {
  clearAllSnapshots(DT);
  renderHistory();
};
window._ciLogoUpload = function(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    if (typeof ev.target.result === 'string') {
      data.logo = ev.target.result;
      saveDocData(DT, data);
      renderForm();
    }
  };
  reader.readAsDataURL(file);
};
window._ciRemoveLogo = function() {
  data.logo = '';
  saveDocData(DT, data);
  renderForm();
};

// ===== Template rendering (common implementation in common.js) =====
function renderTmplBar() { tmplRenderBar(DT, CI_DEFAULT_FIELDS); }
function renderTmplModal() { tmplRenderModal(DT, CI_FIELD_META, CI_TMPL_SECTIONS, CI_TMPL_SECTION_LABELS, CI_DEFAULT_FIELDS); }
function doSaveTmplFromModal() { tmplSaveFromModal(DT, CI_DEFAULT_FIELDS); }
function setupTmplEvents() { tmplSetupEvents(DT, CI_DEFAULT_FIELDS, { fieldMeta: CI_FIELD_META, sections: CI_TMPL_SECTIONS, sectionLabels: CI_TMPL_SECTION_LABELS }); }

// ===== Helpers for form HTML =====
function fieldBlock(title, subtitle) {
  return '<div style="grid-column:1/-1;"><h3 style="font-size:16px;font-weight:600;color:var(--primary);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border-color);">' + title + (subtitle ? ' <span style="font-size:12px;color:var(--text-muted);font-weight:400;">' + subtitle + '</span>' : '') + '</h3></div>';
}
function labelInput(label, value, field, placeholder) {
  return '<div><div class="form-label">' + label + '</div><input class="input-field" value="' + esc(value) + '" onchange="window._ciSet(\'' + field + '\',this.value)" placeholder="' + (placeholder || '') + '"></div>';
}
function labelInputDate(label, value, field) {
  return '<div><div class="form-label">' + label + '</div><input class="input-field" type="date" value="' + esc(value) + '" onchange="window._ciSet(\'' + field + '\',this.value)"></div>';
}
function labelSelect(label, value, field, options) {
  var opts = options.map(function(o) {
    return '<option value="' + o[0] + '"' + (value === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
  }).join('');
  return '<div><div class="form-label">' + label + '</div><select class="input-field" onchange="window._ciSet(\'' + field + '\',this.value)">' + opts + '</select></div>';
}
