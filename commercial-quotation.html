// ===== Auto Calculation =====
function autoCalcCQ(){
  var d=data,sub=0,tdisc=0,ttax=0;
  d.items.forEach(function(it){
    sub+=parseFloat(it.lineTotal)||0;
    tdisc+=parseFloat(it.discount)||0;
    ttax+=parseFloat(it.taxAmount)||0;
  });
  d.subtotal=sub.toFixed(2);
  d.totalDiscount=tdisc.toFixed(2);
  d.totalTax=ttax.toFixed(2);
  var net=sub-(parseFloat(d.totalDiscount)||0)+(parseFloat(d.totalTax)||0);
  d.grandTotal=net.toFixed(2)+' '+(d.currency||'USD');
}

  visCols.forEach(function(c){h+='<th style="width:'+c.width+';">'+c.label+'</th>';});
  h+='<th style="width:36px;">'+(isZh?'操作':'')+'</th></tr></thead><tbody>';

      var v=it[c.field]||'';

  });

  // Totals Summary
  h+='<div class="totals-summary"><div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:12px;">';

  if(isFld('totals.totalDiscount'))h+='<div><span style="font-size:12px;color:#6b7280;">'+(isZh?'总折扣':'Total Discount')+'</span><br><span style="font-size:18px;font-weight:700;color:#dc2626;">'+(d.totalDiscount||'—')+'</span></div>';
  if(isFld('totals.totalTax'))h+='<div><span style="font-size:12px;color:#6b7280;">'+(isZh?'税费':'Tax')+'</span><br><span style="font-size:18px;font-weight:700;color:var(--primary);">'+(d.totalTax||'—')+'</span></div>';

  h+='</div></div></div>';
  // Terms & Remarks
  var hasTerms=isFld('terms.text');
  var hasRemark=isFld('remarks.text');
  var hasSig=isFld('signature.name')||isFld('signature.title')||isFld('signature.date');
  if(hasTerms||hasRemark||hasSig){
  h+='<div class="section-card"><h3>'+fB2(isZh?'条款与签名':'Terms & Signature','')+'</h3>';
  if(hasTerms){h+='<div class="mb-2"><div class="form-label">'+(isZh?'条款条件':'Terms & Conditions')+'</div><textarea class="input-field" rows="3" onchange="window._cqSet(\'termsAndConditions\',this.value)">'+esc(d.termsAndConditions)+'</textarea></div>';}
  if(hasRemark){h+='<div class="mb-2"><div class="form-label">'+(isZh?'备注':'Remarks')+'</div><textarea class="input-field" rows="2" onchange="window._cqSet(\'remarks\',this.value)">'+esc(d.remarks)+'</textarea></div>';}
  if(hasSig){h+='<div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));">';
  if(isFld('signature.name'))h+=lI2(isZh?'签名人':'Signatory',d.signatureName,'signatureName','');
  if(isFld('signature.title'))h+=lI2(isZh?'职务':'Title',d.signatureTitle,'signatureTitle','');
  if(isFld('signature.date'))h+=lID2(isZh?'日期':'Date',d.signatureDate,'signatureDate');
  h+='</div>';}
  h+='</div>';}
  document.getElementById('form-container').innerHTML=h;
}

      if(show('buyer.buyerName'))h+='<div class="section-value" style="line-height:1.3;margin-bottom:1px;font-weight:600;">'+pv(d.buyerName)+'</div>';
      if(show('buyer.buyerPhone'))h+='<div class="section-value" style="line-height:1.3;margin-bottom:1px;font-weight:600;">'+tr2('Tel:','电话：')+pv(d.buyerPhone)+'</div>';

  ];
  var visColsP=itemColsP.filter(function(c){return show(c.key);});
  if(visColsP.length>0){
    var items=d.items||[];
    h+='<table class="items" style="border:1px solid #000;"><thead><tr><th style="width:4%;border:1px solid #000;">#</th>';
    visColsP.forEach(function(c){h+='<th style="width:'+c.width+';border:1px solid #000;">'+c.label+'</th>';});
    h+='</tr></thead><tbody>';
    items.forEach(function(it,idx){
      h+='<tr><td class="text-center" style="border:1px solid #000;padding:5px 6px;">'+(idx+1)+'</td>';
      visColsP.forEach(function(c){
        var v=it[c.field]||'';
        var align=c.field==='description'||c.field==='specification'?'text-left':(c.field==='unitPrice'||c.field==='discount'||c.field==='taxRate'||c.field==='taxAmount'||c.field==='lineTotal'?'text-right':'text-center');
        h+='<td class="'+align+'" style="border:1px solid #000;padding:5px 6px;">'+pv(v)+'</td>';

function renderTmplBar() { tmplRenderBar(DT, CQ_DEFAULT_FIELDS); }
function renderTmplModal() { tmplRenderModal(DT, CQ_FIELD_META, CQ_TMPL_SECTIONS, CQ_TMPL_SECTION_LABELS, CQ_DEFAULT_FIELDS, function(sk) { return sk !== 'logo' || isFld('logo.enabled'); }); }

function renderHistory(){
  var tr=I18N[lang],snaps=loadSnapshots(DT),search=(document.getElementById('history-search').value||'').toLowerCase();
  if(search)snaps=snaps.filter(function(s){return(s.label||'').toLowerCase().indexOf(search)!==-1||(s.ref||'').toLowerCase().indexOf(search)!==-1;});
  var h='';if(snaps.length===0){h+='<div class="history-empty">'+svg('Clock',48)+'<p>'+tr.noHistory+'</p></div>';}
  else{h+='<div style="margin-bottom:12px;font-size:13px;color:var(--text-muted);">'+snaps.length+' '+tr.records+'</div><div class="history-list">';
  snaps.forEach(function(s){h+='<div class="history-item"><div class="history-item-info"><div class="history-item-label">'+esc(s.label||'draft')+'</div>';
  h+='<div class="history-item-ref">'+esc(s.ref||'')+' — '+formatDateTime(s.exportedAt)+'</div></div><div class="history-item-actions">';
  h+='<button class="btn btn-secondary btn-sm" onclick="window._cqRestore(\''+s.id+'\')">'+tr.restore+'</button>';
  h+='<button class="btn btn-danger btn-sm" onclick="window._cqDeleteSnap(\''+s.id+'\')">'+tr.delete+'</button></div></div>';});
  h+='</div><div style="margin-top:16px;"><button class="btn btn-secondary btn-sm" onclick="window._cqClearAllHistory()">'+tr.clearAll+'</button></div>';}
  document.getElementById('history-container').innerHTML=h;document.getElementById('history-search').oninput=function(){renderHistory();};
}

window._cqDeleteSnap=function(id){deleteSnapshot(DT,id);renderHistory();};window._cqClearAllHistory=function(){clearAllSnapshots(DT);renderHistory();};
window._cqLogoUpload=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){data.logo=ev.target.result;saveDocData(DT,data);renderForm();};r.readAsDataURL(f);};
window._cqRemoveLogo=function(){data.logo='';saveDocData(DT,data);renderForm();};
