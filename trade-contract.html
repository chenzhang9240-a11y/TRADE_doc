// ===== Auto-calc =====
function autoCalcTC(){
  var total=0;
  (data.items||[]).forEach(function(it){total+=parseFloat(it.totalAmount)||0;});
  data.totalAmount=total.toFixed(2)+(data.currency?' '+data.currency:'');
  saveDocData(DT,data);
}

// ===== Template Toolbar =====
function renderTmplBar(){ tmplRenderBar(DT, TC_DEFAULT_FIELDS); }
function renderTmplModal(){
  var isZh=lang==='zh';
  var t=getCurrentTmpl(DT,TC_DEFAULT_FIELDS);
  document.getElementById('tmpl-modal-title').textContent=isZh?'字段配置 - '+t.name:'Field Config - '+t.name;
  var sections=TC_TMPL_SECTIONS;
  var h='';
  sections.forEach(function(sk){
    var secFields=Object.keys(TC_FIELD_META).filter(function(k){return TC_FIELD_META[k].section===sk;});
    if(secFields.length===0)return;
    var sl=TC_TMPL_SECTION_LABELS[sk];
    h+='<div style="margin-bottom:14px;"><h4 style="font-size:14px;color:var(--text-primary);margin-bottom:8px;">'+(sl?(isZh?sl.zh:sl.en):sk)+'</h4><div style="display:flex;flex-wrap:wrap;gap:8px;">';
    secFields.forEach(function(fk){
      var meta=TC_FIELD_META[fk];
      var val=t.fields[fk];
      var required=val==='required';
      var checked=val==='required'||val===true;
      var disabled=required?'disabled':'';
      var cn=required?'color:#999;cursor:not-allowed;':'';
      h+='<label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;padding:4px 8px;background:var(--bg);border-radius:4px;'+cn+'">';
      h+='<input type="checkbox" '+(checked?'checked':'')+' '+disabled+' data-fk="'+fk+'" style="cursor:pointer;">';
      h+=(isZh?meta.labelCn:meta.label);
      if(required)h+=' <span style="color:#e74c3c;">*</span>';
      h+='</label>';
    });
    h+='</div></div>';
  });
  document.getElementById('tmpl-modal-body').innerHTML=h;
  document.getElementById('btn-tmpl-modal-cancel').textContent=isZh?'取消':'Cancel';
  document.getElementById('btn-tmpl-modal-save').textContent=isZh?'保存':'Save';
  document.getElementById('tmpl-modal').classList.remove('hidden');
}
function doSaveTmplFromModal(){
  var data=ensureTmplData(DT,TC_DEFAULT_FIELDS);
  var tmpl=data.templates.find(function(t){return t.id===data.currentTemplateId;});
  if(!tmpl)return;
  var cbs=document.querySelectorAll('#tmpl-modal input[type=checkbox]');
  cbs.forEach(function(cb){
    var fk=cb.getAttribute('data-fk');
    if(fk&&TC_DEFAULT_FIELDS[fk]!=='required'){tmpl.fields[fk]=cb.checked;}
  });
  saveTmplData(DT,data);
  document.getElementById('tmpl-modal').classList.add('hidden');
  renderAll();
}
function setupTmplEvents(){
  window._tcSwitchTmpl=function(id){
    setCurrentTmpl(DT,id,TC_DEFAULT_FIELDS);
    previewLang=getTmplPreviewLang(DT,TC_DEFAULT_FIELDS);
    renderAll();
  };
  window._tcSaveTmpl=function(){
    renderTmplModal();
    document.getElementById('tmpl-modal').classList.remove('hidden');
  };
  window._tcSaveTmplFromModal=function(){doSaveTmplFromModal();};
  window._tcNewTmpl=function(){
    var name=prompt(I18N[lang].newTmplPrompt||'Enter template name:');
    if(!name)return;
    var newFields={};
    for(var key in TC_DEFAULT_FIELDS){
      if(TC_DEFAULT_FIELDS[key]==='required'){newFields[key]='required';}else{newFields[key]=false;}
    }
    var t=saveNewTmpl(DT,name,newFields,lang==='zh'?'zh':'en',TC_DEFAULT_FIELDS);
    if(t){setCurrentTmpl(DT,t.id,TC_DEFAULT_FIELDS);previewLang=getTmplPreviewLang(DT,TC_DEFAULT_FIELDS);renderAll();}
  };
  window._tcDeleteCurrentTmpl=function(){
    if(!confirm(I18N[lang].confirmDeleteTmpl||'Delete this template?'))return;
    var current=getCurrentTmpl(DT,TC_DEFAULT_FIELDS);
    deleteTmpl(DT,current.id,TC_DEFAULT_FIELDS);
    previewLang=getTmplPreviewLang(DT,TC_DEFAULT_FIELDS);
    renderAll();
  };
  // Static element event bindings
  document.getElementById('btn-tmpl-config').onclick=function(){renderTmplModal();};
  document.getElementById('tmpl-selector').onchange=function(){
    window._tcSwitchTmpl(this.value);
  };
  document.getElementById('btn-tmpl-save').onclick=doSaveTmplFromModal;
  document.getElementById('btn-tmpl-modal-cancel').onclick=function(){document.getElementById('tmpl-modal').classList.add('hidden');};
  document.getElementById('btn-tmpl-modal-save').onclick=doSaveTmplFromModal;
  document.getElementById('btn-tmpl-new').onclick=function(){
    var name=prompt(I18N[lang].newTmplPrompt||'Enter template name:');
    if(!name)return;
    var newFields={};
    for(var key in TC_DEFAULT_FIELDS){
      if(TC_DEFAULT_FIELDS[key]==='required'){newFields[key]='required';}else{newFields[key]=false;}
    }
    var t=saveNewTmpl(DT,name,newFields,lang==='zh'?'zh':'en',TC_DEFAULT_FIELDS);
    if(t){setCurrentTmpl(DT,t.id,TC_DEFAULT_FIELDS);previewLang=getTmplPreviewLang(DT,TC_DEFAULT_FIELDS);renderAll();}
  };
  document.getElementById('btn-tmpl-delete').onclick=function(){
    if(!confirm(I18N[lang].confirmDeleteTmpl||'Delete this template?'))return;
    var current=getCurrentTmpl(DT,TC_DEFAULT_FIELDS);
    deleteTmpl(DT,current.id,TC_DEFAULT_FIELDS);
    previewLang=getTmplPreviewLang(DT,TC_DEFAULT_FIELDS);
    renderAll();
  };
}

// ===== History, Event handlers =====
function renderHistory(){
  var tr=I18N[lang],snaps=loadSnapshots(DT),search=(document.getElementById('history-search').value||'').toLowerCase();
  if(search)snaps=snaps.filter(function(s){return(s.label||'').toLowerCase().indexOf(search)!==-1||(s.ref||'').toLowerCase().indexOf(search)!==-1;});
  var h='';if(snaps.length===0){h+='<div class="history-empty">'+svg('Clock',48)+'<p>'+tr.noHistory+'</p></div>';}
  else{h+='<div style="margin-bottom:12px;font-size:13px;color:var(--text-muted);">'+snaps.length+' '+tr.records+'</div><div class="history-list">';
  snaps.forEach(function(s){h+='<div class="history-item"><div class="history-item-info"><div class="history-item-label">'+esc(s.label||'draft')+'</div>';
  h+='<div class="history-item-ref">'+esc(s.ref||'')+' — '+formatDateTime(s.exportedAt)+'</div></div><div class="history-item-actions">';
  h+='<button class="btn btn-secondary btn-sm" onclick="window._tcRestore(\''+s.id+'\')">'+tr.restore+'</button>';
  h+='<button class="btn btn-danger btn-sm" onclick="window._tcDeleteSnap(\''+s.id+'\')">'+tr.delete+'</button></div></div>';});
  h+='</div><div style="margin-top:16px;"><button class="btn btn-secondary btn-sm" onclick="window._tcClearAllHistory()">'+tr.clearAll+'</button></div>';}
  document.getElementById('history-container').innerHTML=h;document.getElementById('history-search').oninput=function(){renderHistory();};
}

window._tcSet=function(f,v){data[f]=v;saveDocData(DT,data);};
window._tcItem=function(idx,f,v){data.items[idx][f]=v;autoCalcItem(DT,data.items[idx]);autoCalcTC();saveDocData(DT,data);renderForm();};
window._tcAddItem=function(){data.items.push(getEmptyItem(DT));autoCalcTC();saveDocData(DT,data);renderForm();};
window._tcRemoveItem=function(idx){if(data.items.length>1){data.items.splice(idx,1);autoCalcTC();saveDocData(DT,data);renderForm();}};
window._tcRestore=function(id){var snaps=loadSnapshots(DT),s=snaps.find(function(x){return x.id===id;});if(s&&s.data){data=JSON.parse(JSON.stringify(s.data));saveDocData(DT,data);renderAll();}};
window._tcDeleteSnap=function(id){deleteSnapshot(DT,id);renderHistory();};window._tcClearAllHistory=function(){clearAllSnapshots(DT);renderHistory();};
