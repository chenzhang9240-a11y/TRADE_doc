<script>
var DT='cost_estimation',DT_META=DOC_META[DT],lang=getLang(),dark=isDark(),previewLang=getLang(),activePreviewTab='sea',data=null,showClearConfirm=false;
var TAB_KEYS=['sea','lcl','air','courier','parcel'];
var TAB_ICONS={'sea':'🚢','lcl':'🚢','air':'✈️','courier':'📦','parcel':'🌐'};
var TAB_NAMES={'sea':{zh:'海运 FCL',en:'Sea FCL'},'lcl':{zh:'海运 LCL',en:'Sea LCL'},'air':{zh:'空运',en:'Air Freight'},'courier':{zh:'快递',en:'Courier'},'parcel':{zh:'跨境小包专线',en:'Parcel'}};

function init(){applyTheme();var s=loadDocData(DT);
  var aiPrefill = loadAiPrefill(DT);
  if (aiPrefill && !saved) {
    var defaults = getDefaultDoc(DT);
    data = mergeAiFields(defaults, aiPrefill.fields);
    saveDocData(DT, data);
    localStorage.removeItem(getUserId() + '_ai_prefill_' + DT);
    showAiSuggestion(aiPrefill.suggestion);
  } else { data = saved ? saved : getDefaultDoc(DT); }renderAll();}
function migrateData(d){
  if(!d.lcl)d.lcl={sections:[{name:'一、国内段（起运港）', items:[]},{name:'二、主运费（海运）', items:[]},{name:'三、目的港段', items:[]},{name:'四、隐性费用', items:[]}]};
  // Migrate old containerType/containerQty to containerSpec
  if(d.containerType!==undefined&&d.containerSpec===undefined){
    d.containerSpec=(d.containerQty||'')+(d.containerQty&&d.containerType?'×':'')+(d.containerType||'');
  }
  return d;
}
function init(){applyTheme();var s=loadDocData(DT);data=s?migrateData(s):getDefaultDoc(DT);renderAll();}
injectSpaButton();injectBottomCta();injectPageFaq();

function renderForm(){
  var tr=I18N[lang],isZh=lang==='zh',d=data,esc2=esc;
  document.getElementById('btn-load-sample').textContent=tr.loadSample;document.getElementById('btn-clear').textContent=tr.clear;
  document.getElementById('btn-switch-preview').textContent=tr.preview;document.getElementById('btn-pdf').textContent=tr.exportPdf;
  document.getElementById('btn-back-edit').textContent=tr.backEdit;document.getElementById('btn-preview-lang').textContent=previewLang==='en'?'Switch to 中文':'Switch to English';
  document.getElementById('btn-pdf-preview').textContent=tr.exportPdf;document.getElementById('btn-print').textContent=tr.print;
  document.getElementById('history-search').placeholder=tr.searchPlaceholder;
  document.getElementById('btn-load-sample').onclick=loadSample;document.getElementById('btn-clear').onclick=function(){showClearConfirm=true;renderClearModal();};
  document.getElementById('btn-switch-preview').onclick=function(){switchTab('preview');renderPreview();};document.getElementById('btn-back-edit').onclick=function(){switchTab('edit');};
  document.getElementById('btn-pdf').onclick=function(){doExportPdf(DT,data,'preview-content');};document.getElementById('btn-pdf-preview').onclick=function(){doExportPdf(DT,data,'preview-content');};
  document.getElementById('btn-preview-lang').onclick=function(){previewLang=previewLang==='en'?'zh':'en';renderPreview();};document.getElementById('btn-print').onclick=function(){window.print();};

  var h='';

  // ===== Project Info =====
  h+='<div class="section-card"><h3>'+fieldBlock(isZh?'项目信息':'Project Info','')+'</h3>';
  h+='<div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(200px,1fr));">';
  h+=labelInput(isZh?'项目名称':'Project Name',d.projectName,'projectName');
  h+=labelInput(isZh?'客户':'Client',d.client,'client');
  h+=labelInputDate(isZh?'编制日期':'Date',d.preparationDate,'preparationDate');
  h+=labelInput(isZh?'编制人':'Prepared By',d.preparedBy,'preparedBy');
  h+=labelInput(isZh?'起运地':'Origin',d.origin,'origin');
  h+=labelInput(isZh?'目的地':'Destination',d.destination,'destination');
  h+=labelInput(isZh?'贸易条款':'Trade Terms',d.tradeTerms,'tradeTerms');
  h+=labelInput(isZh?'报价有效期':'Price Validity',d.priceValidity,'priceValidity');
  h+='</div></div>';

  // ===== Cargo Data =====
  h+='<div class="section-card"><h3>'+fieldBlock(isZh?'货物数据':'Cargo Data','')+'</h3>';
  h+='<div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(160px,1fr));">';
  h+=labelInput(isZh?'箱型&箱量':'Container Spec',d.containerSpec,'containerSpec');
  h+=labelInput(isZh?'毛重 (kg)':'Gross Wt',d.grossWeight,'grossWeight');
  h+=labelInput(isZh?'计费重 (kg)':'Chargeable Wt',d.chargeableWeight,'chargeableWeight');
  h+=labelInput(isZh?'体积 (CBM)':'Volume',d.volume,'volume');
  h+=labelInput(isZh?'货物类型':'Cargo Type',d.cargoType,'cargoType');
  h+='</div></div>';

  // ===== Exchange Rates =====
  h+='<div class="section-card"><h3>'+fieldBlock(isZh?'汇率':'Exchange Rates','')+'</h3>';
  h+='<div class="items-table-container"><table class="items-table"><thead><tr>';
  h+='<th>'+(isZh?'币种':'Currency')+'</th><th>'+(isZh?'兑人民币汇率':'Rate to CNY')+'</th><th>'+(isZh?'操作':'Action')+'</th></tr></thead><tbody>';
  (d.exchangeRates||[]).forEach(function(r,idx){
    h+='<tr><td><select class="input-field input-field-xs" onchange="window._ceExRate('+idx+',\'currency\',this.value)">';
    CURRENCIES.forEach(function(c){h+='<option value="'+c+'"'+(r.currency===c?' selected':'')+'>'+c+'</option>';});
    h+='</select></td><td><input class="input-field input-field-xs text-right" type="number" step="0.0001" value="'+esc2(r.rate)+'" onchange="window._ceExRate('+idx+',\'rate\',this.value)"></td>';
    h+='<td><button class="btn btn-danger btn-sm" onclick="window._ceRemoveExRate('+idx+')" '+(d.exchangeRates.length<=1?'disabled':'')+'>&times;</button></td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<button class="btn btn-success btn-sm" onclick="window._ceAddExRate()" style="margin-top:4px;">+ '+(isZh?'添加汇率':'Add Rate')+'</button>';
  h+='</div>';

  // ===== Transport Mode Tabs =====
  h+='<div class="section-card"><h3>'+fieldBlock(isZh?'运输模式与成本明细':'Transport Mode & Cost Items','')+'</h3>';
  h+='<div class="ce-tabs" style="display:flex;border-bottom:1px solid #e4e9f0;background:#f8faff;border-radius:8px 8px 0 0;">';
  TAB_KEYS.forEach(function(key){
    var act=(d.activeTab===key);
    h+='<button class="ce-tab-btn'+(act?' active':'')+'" onclick="window._ceSwitchTab(\''+key+'\')" style="padding:10px 20px;font-size:14px;cursor:pointer;border:none;background:'+(act?'#fff':'transparent')+';border-bottom:2px solid '+(act?'#0066cc':'transparent')+';color:'+(act?'#002b5e':'#445566')+';font-weight:'+(act?'600':'400')+';margin-bottom:-1px;">'+TAB_ICONS[key]+' '+(isZh?TAB_NAMES[key].zh:TAB_NAMES[key].en)+'</button>';
  });
  h+='</div>';

  // ===== Active Tab Sections =====
  var activeTabKey=d.activeTab||'sea',tabData=d[activeTabKey]||{sections:[]};
  tabData.sections.forEach(function(sec,secIdx){
    h+='<div style="margin-top:14px;border:1px solid #e4e9f0;border-radius:8px;overflow:hidden;">';
    h+='<div style="background:#eef3fc;padding:8px 14px;font-weight:600;font-size:13px;color:#003366;">'+esc(sec.name)+'</div>';
    h+='<div class="items-table-container" style="overflow-x:auto;"><table class="items-table"><thead><tr>';
    h+='<th>'+(isZh?'成本科目':'Item')+'</th>';
    h+='<th>'+(isZh?'供应商/来源':'Supplier')+'</th>';
    h+='<th>'+(isZh?'底价':'Base')+'</th>';
    h+='<th>'+(isZh?'币种':'Curr')+'</th>';
    h+='<th>'+(isZh?'数量':'Qty')+'</th>';
    h+='<th>'+(isZh?'我司成本':'Cost')+'</th>';
    h+='<th>'+(isZh?'成本合计':'Total Cost')+'</th>';
    h+='<th>'+(isZh?'卖价':'Sell')+'</th>';
    h+='<th>'+(isZh?'卖价合计':'Total Sell')+'</th>';
    h+='<th>'+(isZh?'毛利':'Profit')+'</th>';
    h+='<th>'+(isZh?'备注':'Note')+'</th>';
    h+='<th></th></tr></thead><tbody>';
    (sec.items||[]).forEach(function(it,itemIdx){
      var profit=(parseFloat(it.sellPrice)||0)-(parseFloat(it.ourCost)||0);
      h+='<tr>';
      h+='<td><input class="input-field input-field-xs" value="'+esc2(it.costItem)+'" onchange="window._ceItem(\''+activeTabKey+'\','+secIdx+','+itemIdx+',\'costItem\',this.value)"></td>';
      h+='<td><input class="input-field input-field-xs" value="'+esc2(it.supplier)+'" onchange="window._ceItem(\''+activeTabKey+'\','+secIdx+','+itemIdx+',\'supplier\',this.value)"></td>';
      h+='<td><input class="input-field input-field-xs text-right" type="number" step="0.01" value="'+esc2(it.basePrice)+'" onchange="window._ceItem(\''+activeTabKey+'\','+secIdx+','+itemIdx+',\'basePrice\',this.value)"></td>';
      h+='<td><select class="input-field input-field-xs" onchange="window._ceItem(\''+activeTabKey+'\','+secIdx+','+itemIdx+',\'currency\',this.value)">';
      CURRENCIES.forEach(function(c){h+='<option value="'+c+'"'+(it.currency===c?' selected':'')+'>'+c+'</option>';});
      h+='</select></td>';
      h+='<td><input class="input-field input-field-xs text-right" type="number" step="1" min="0" value="'+esc2(it.qty||'1')+'" onchange="window._ceItem(\''+activeTabKey+'\','+secIdx+','+itemIdx+',\'qty\',this.value);autoCalcItem(DT,data[\''+activeTabKey+'\'].sections['+secIdx+'].items['+itemIdx+']);renderForm();renderPreview();"></td>';
      h+='<td><input class="input-field input-field-xs text-right" type="number" step="0.01" value="'+esc2(it.ourCost)+'" onchange="window._ceItem(\''+activeTabKey+'\','+secIdx+','+itemIdx+',\'ourCost\',this.value);autoCalcItem(DT,data[\''+activeTabKey+'\'].sections['+secIdx+'].items['+itemIdx+']);renderForm();renderPreview();"></td>';
      h+='<td class="text-right" style="font-weight:500;">'+esc2(it.totalCost||((parseFloat(it.ourCost)||0)*(parseFloat(it.qty)||1)).toFixed(2))+'</td>';
      h+='<td><input class="input-field input-field-xs text-right" type="number" step="0.01" value="'+esc2(it.sellPrice)+'" onchange="window._ceItem(\''+activeTabKey+'\','+secIdx+','+itemIdx+',\'sellPrice\',this.value);autoCalcItem(DT,data[\''+activeTabKey+'\'].sections['+secIdx+'].items['+itemIdx+']);renderForm();renderPreview();"></td>';
      h+='<td class="text-right" style="font-weight:500;">'+esc2(it.totalSell||((parseFloat(it.sellPrice)||0)*(parseFloat(it.qty)||1)).toFixed(2))+'</td>';
      h+='<td class="text-right" style="font-weight:500;color:'+(profit>=0?'#157f4b':'#bb3030')+';">'+profit.toFixed(2)+'</td>';
      h+='<td><input class="input-field input-field-xs" value="'+esc2(it.note)+'" onchange="window._ceItem(\''+activeTabKey+'\','+secIdx+','+itemIdx+',\'note\',this.value)"></td>';
      h+='<td><button class="btn btn-danger btn-sm" onclick="window._ceRemoveItem(\''+activeTabKey+'\','+secIdx+','+itemIdx+')">&times;</button></td>';
      h+='</tr>';
    });
    // Section subtotal
    var secCost=sec.items.reduce(function(s,it){return s+(parseFloat(it.totalCost)||0);},0);
    var secSell=sec.items.reduce(function(s,it){return s+(parseFloat(it.totalSell)||0);},0);
    h+='<tr style="background:#fafbfd;border-top:1px dashed #c8d2de;">';
    h+='<td colspan="4" style="text-align:right;padding-right:20px;font-weight:500;">'+(isZh?'本段小计：':'Subtotal:')+'</td>';
    h+='<td></td>';
    h+='<td></td>';
    h+='<td class="text-right font-medium">'+secCost.toFixed(2)+'</td>';
    h+='<td></td>';
    h+='<td class="text-right font-medium">'+secSell.toFixed(2)+'</td>';
    h+='<td class="text-right font-medium" style="color:'+((secSell-secCost)>=0?'#157f4b':'#bb3030')+';">'+(secSell-secCost).toFixed(2)+'</td>';
    h+='<td colspan="2"></td></tr>';
    h+='</tbody></table></div>';
    h+='<button class="btn btn-success btn-sm" onclick="window._ceAddItem(\''+activeTabKey+'\','+secIdx+')" style="margin:6px 8px;">+ '+(isZh?'添加行':'Add Row')+'</button>';
    h+='</div>';
  });
  h+='</div>';

  // ===== Grand Total =====
  var rates={};(d.exchangeRates||[]).forEach(function(r){rates[r.currency]=parseFloat(r.rate)||1;});rates['CNY']=1;
  var grandCost=0,grandSell=0;
  TAB_KEYS.forEach(function(key){
    var td=d[key];if(!td||!td.sections)return;
    td.sections.forEach(function(sec){(sec.items||[]).forEach(function(it){
      var rate=rates[it.currency]||1;
      grandCost+=(parseFloat(it.totalCost||((parseFloat(it.ourCost)||0)*(parseFloat(it.qty)||1)))||0)*rate;
      grandSell+=(parseFloat(it.totalSell||((parseFloat(it.sellPrice)||0)*(parseFloat(it.qty)||1)))||0)*rate;
    });});
  });
  var grandProfit=grandSell-grandCost,grandMargin=grandSell>0?grandProfit/grandSell*100:0;
  h+='<div class="section-card"><h3>'+fieldBlock(isZh?'合计（折合人民币）':'Grand Total (CNY)','')+'</h3>';
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;padding:16px;background:#eaf1fb;border-radius:8px;">';
  h+='<div><span style="font-size:12px;color:#516272;">'+(isZh?'总成本 (CNY)':'Total Cost (CNY)')+'</span><br><span style="font-size:22px;font-weight:700;color:#003366;">¥'+grandCost.toFixed(2)+'</span></div>';
  h+='<div><span style="font-size:12px;color:#516272;">'+(isZh?'总卖价 (CNY)':'Total Sell (CNY)')+'</span><br><span style="font-size:22px;font-weight:700;color:#003366;">¥'+grandSell.toFixed(2)+'</span></div>';
  h+='<div><span style="font-size:12px;color:#516272;">'+(isZh?'毛利 (CNY)':'Gross Profit (CNY)')+'</span><br><span style="font-size:22px;font-weight:700;color:'+(grandProfit>=0?'#157f4b':'#bb3030')+';">'+(grandProfit>=0?'+':'')+'¥'+grandProfit.toFixed(2)+'</span></div>';
  h+='<div><span style="font-size:12px;color:#516272;">'+(isZh?'毛利率':'Gross Margin')+'</span><br><span style="font-size:22px;font-weight:700;color:#003366;">'+grandMargin.toFixed(1)+'%</span></div></div>';
  h+='</div>';

  // ===== Notes =====
  h+='<div class="section-card"><h3>'+fieldBlock(isZh?'备注':'Notes','')+'</h3>';
  h+='<textarea class="input-field" rows="3" onchange="window._ceSetField(\'notes\',this.value)">'+esc2(d.notes)+'</textarea></div>';

  document.getElementById('form-container').innerHTML=h;
}

function renderPreview(){
  var isZh2=previewLang==='zh',d=data,esc2=esc;
  function tr2(en,zh){return isZh2?zh:en;}
  var rates={};(d.exchangeRates||[]).forEach(function(r){rates[r.currency]=parseFloat(r.rate)||1;});rates['CNY']=1;

  // Calculate grand totals
  var grandCost=0,grandSell=0;
  TAB_KEYS.forEach(function(key){
    var td=d[key];if(!td||!td.sections)return;
    td.sections.forEach(function(sec){(sec.items||[]).forEach(function(it){
      var rate=rates[it.currency]||1;
      grandCost+=(parseFloat(it.totalCost||((parseFloat(it.ourCost)||0)*(parseFloat(it.qty)||1)))||0)*rate;
      grandSell+=(parseFloat(it.totalSell||((parseFloat(it.sellPrice)||0)*(parseFloat(it.qty)||1)))||0)*rate;
    });});
  });
  var grandProfit=grandSell-grandCost,grandMargin=grandSell>0?grandProfit/grandSell*100:0;

  var h='<div class="invoice-preview" id="preview-content">';

  // Header
  h+='<div class="title">'+tr2('COST ESTIMATION','成本估算单')+'</div>';

  // Info block

function renderHistory(){

  if(search)snaps=snaps.filter(function(s){return(s.label||'').toLowerCase().indexOf(search)!==-1||(s.ref||'').toLowerCase().indexOf(search)!==-1;});
  var h='';if(snaps.length===0){h+='<div class="history-empty">'+svg('Clock',48)+'<p>'+tr.noHistory+'</p></div>';}
  else{h+='<div style="margin-bottom:12px;font-size:13px;color:var(--text-muted);">'+snaps.length+' '+tr.records+'</div><div class="history-list">';
  snaps.forEach(function(s){h+='<div class="history-item"><div class="history-item-info"><div class="history-item-label">'+esc(s.label||'draft')+'</div>';
  h+='<div class="history-item-ref">'+esc(s.ref||'')+' — '+formatDateTime(s.exportedAt)+'</div></div><div class="history-item-actions">';
  h+='<button class="btn btn-secondary btn-sm" onclick="window._ceRestore(\''+s.id+'\')">'+tr.restore+'</button>';
  h+='<button class="btn btn-danger btn-sm" onclick="window._ceDeleteSnap(\''+s.id+'\')">'+tr.delete+'</button></div></div>';});
  h+='</div><div style="margin-top:16px;"><button class="btn btn-secondary btn-sm" onclick="window._ceClearAllHistory()">'+tr.clearAll+'</button></div>';}
  document.getElementById('history-container').innerHTML=h;document.getElementById('history-search').oninput=function(){renderHistory();};
}

// ===== Data manipulation functions =====
window._ceSetField=function(f,v){data[f]=v;saveDocData(DT,data);renderForm();renderPreview();};
  injectSpaButton();
  injectBottomCta();
  injectPageFaq();
window._ceItem=function(tabKey,secIdx,itemIdx,f,v){
  if(!data[tabKey]||!data[tabKey].sections||!data[tabKey].sections[secIdx])return;
  if(!data[tabKey].sections[secIdx].items[itemIdx])return;
  data[tabKey].sections[secIdx].items[itemIdx][f]=v;
  saveDocData(DT,data);renderForm();renderPreview();
};
window._ceAddItem=function(tabKey,secIdx){
  if(!data[tabKey]||!data[tabKey].sections||!data[tabKey].sections[secIdx])return;
  data[tabKey].sections[secIdx].items.push(getEmptyItem(DT));
  saveDocData(DT,data);renderForm();renderPreview();
};
window._ceRemoveItem=function(tabKey,secIdx,itemIdx){
  if(!data[tabKey]||!data[tabKey].sections||!data[tabKey].sections[secIdx])return;
  var items=data[tabKey].sections[secIdx].items;
  if(items&&items.length>1){items.splice(itemIdx,1);saveDocData(DT,data);renderForm();renderPreview();}
};
window._ceAddExRate=function(){
  data.exchangeRates.push({currency:'USD',rate:'7.25'});
  saveDocData(DT,data);renderForm();
};
window._ceRemoveExRate=function(idx){
  if(data.exchangeRates.length>1){data.exchangeRates.splice(idx,1);saveDocData(DT,data);renderForm();}
};
window._ceExRate=function(idx,f,v){
  data.exchangeRates[idx][f]=v;
  saveDocData(DT,data);renderForm();
};
window._ceSwitchTab=function(key){
  data.activeTab=key;
  saveDocData(DT,data);renderForm();
};
window._ceSwitchPreviewTab=function(key){
  activePreviewTab=key;
  renderPreview();
};
window._ceRestore=function(id){var snaps=loadSnapshots(DT),s=snaps.find(function(x){return x.id===id;});if(s&&s.data){data=JSON.parse(JSON.stringify(s.data));saveDocData(DT,data);renderAll();}};
window._ceDeleteSnap=function(id){deleteSnapshot(DT,id);renderHistory();};window._ceClearAllHistory=function(){clearAllSnapshots(DT);renderHistory();};
