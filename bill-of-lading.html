function renderTmplBar(){
  var tr=I18N[lang],isZh=lang==='zh',tmplData=ensureTmplData(DT,BL_DEFAULT_FIELDS),templates=tmplData.templates,currId=tmplData.currentTemplateId;
  var h='<div class="tmpl-bar">';
  h+='<button class="btn btn-secondary btn-sm" onclick="window._showTmplConfig()" title="'+(isZh?'字段配置':'Field Config')+'">⚙ '+(isZh?'字段配置':'Fields')+'</button>';

  h+='<select class="input-field tmpl-select" id="tmpl-select" onchange="window._switchTmpl(this.value)">';

  h+='</select>';
  h+='<button class="btn btn-secondary btn-sm" onclick="window._saveCurrTmpl()">💾 '+(isZh?'保存':'Save')+'</button>';
  h+='<button class="btn btn-secondary btn-sm" onclick="window._newTmpl()">+ '+(isZh?'新建':'New')+'</button>';
  var curr=templates.find(function(t){return t.id===currId;});

}
function renderTmplModal(){
  var isZh2=lang==='zh';
  function tr2(e,z){return isZh2?z:e;}
  var tmplData=ensureTmplData(DT,BL_DEFAULT_FIELDS),currId=tmplData.currentTemplateId;
  var curr=tmplData.templates.find(function(t){return t.id===currId;});
  if(!curr)return;
  document.getElementById('tmpl-modal').classList.remove('hidden');
  document.getElementById('tmpl-modal-title').textContent=isZh2?'字段配置：':'Field Config: ';
  var h='';
  BL_TMPL_SECTIONS.forEach(function(sk){
    var sl=BL_TMPL_SECTION_LABELS[sk];
    h+='<div class="tmpl-modal-section"><div class="tmpl-modal-section-title">'+(sl?sl[lang]:sk)+'</div><div class="tmpl-field-row">';
    Object.keys(BL_FIELD_META).forEach(function(fk){
      if(BL_FIELD_META[fk].section!==sk)return;
      var val=curr.fields[fk];
      var isReq=val==='required';
      var isChecked=isReq||val===true;
      var fm=BL_FIELD_META[fk];
      h+='<label class="tmpl-field-item'+(isReq?' required':'')+'">';
      h+='<input type="checkbox"'+(isChecked?' checked':'')+(isReq?' disabled':'')+' onchange="window._tmplToggleField(\''+fk+'\',this.checked)">';
      h+='<span'+(isReq?' class="disabled-label"':'')+'>'+(isZh2?fm.labelCn:fm.label)+'</span>';
      h+='</label>';
    });
    h+='</div></div>';
  });

  h+='<label><input type="radio" name="tmpl-preview-lang" value="en" '+(curr.previewLang==='en'?'checked':'')+' onchange="window._tmplSetPreviewLang(\'en\')"> English</label>';

  document.getElementById('tmpl-modal-body').innerHTML=h;
  document.getElementById('btn-tmpl-save').textContent=isZh2?'保存配置':'Save';

function _numToWords(n){
  var ones=['','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE','TEN','ELEVEN','TWELVE','THIRTEEN','FOURTEEN','FIFTEEN','SIXTEEN','SEVENTEEN','EIGHTEEN','NINETEEN'];
  var tens=['','','TWENTY','THIRTY','FORTY','FIFTY','SIXTY','SEVENTY','EIGHTY','NINETY'];
  if(n===0)return 'ZERO';
  var s='';
  if(n>=1000){s+=ones[Math.floor(n/1000)]+' THOUSAND ';n%=1000;}
  if(n>=100){s+=ones[Math.floor(n/100)]+' HUNDRED ';n%=100;}
  if(n>=20){s+=tens[Math.floor(n/10)]+(n%10?'-'+ones[n%10]:'');n=0;}
  else if(n>0){s+=ones[n];n=0;}
  return s.trim();
}
function _blCalcTotals(){
  if(!data||!data.items)return;
  data.totalPkgs=data.items.reduce(function(s,it){return s+(parseFloat(it.numberOfPkgs)||0);},0).toString();
  data.totalGrossWeight=data.items.reduce(function(s,it){return s+(parseFloat(it.grossWeight)||0);},0).toFixed(2)+' KG';
  data.totalMeasurement=data.items.reduce(function(s,it){return s+(parseFloat(it.measurement)||0);},0).toFixed(3)+' CBM';
  // Auto-fill totalPkgsWords
  var pkgType=data.items[0]&&data.items[0].packagingType?data.items[0].packagingType:'PACKAGES';
  var totalNum=parseFloat(data.totalPkgs)||0;
  if(totalNum>0){
    data.totalPkgsWords='SAY '+_numToWords(totalNum)+' ('+data.totalPkgs+') '+pkgType+' ONLY';
  }
}
window._blCalcTotals=_blCalcTotals;
window._showTmplConfig=function(){renderTmplModal();};

window._tmplToggleField=function(fk,checked){

};
window._switchTmpl=function(id){

  if(curr){previewLang=curr.previewLang||'en';}

};
window._saveCurrTmpl=function(){
  var tmplData=ensureTmplData(DT,BL_DEFAULT_FIELDS),currId=tmplData.currentTemplateId;

  var name=prompt(isZh2?'保存模板为：':'Save template as:',curr.name);
  if(!name)return;
  curr.name=name;saveTmplData(DT,tmplData);renderTmplBar();
};
window._newTmpl=function(){
  var tmplData=ensureTmplData(DT,BL_DEFAULT_FIELDS);
  var isZh2=lang==='zh';
  var name=prompt(isZh2?'新模板名称：':'New template name:','');
  if(!name)return;
  var id='tmpl_'+Date.now();
  var fields={};
  Object.keys(BL_DEFAULT_FIELDS).forEach(function(k){fields[k]=false;});
  var curr=tmplData.templates.find(function(t){return t.id===tmplData.currentTemplateId;});
  if(curr){Object.keys(curr.fields).forEach(function(k){fields[k]=curr.fields[k];});}
  fields['shipper.shipperName']='required';fields['shipper.shipperAddress']='required';
  fields['consignee.consigneeName']='required';fields['consignee.consigneeAddress']='required';
  fields['notifyParty.notifyPartyName']='required';fields['notifyParty.notifyPartyAddress']='required';
  fields['signature.shippedOnBoardDate']='required';fields['signature.carrierSignatureDate']='required';
  tmplData.templates.push({id:id,name:name,builtIn:false,previewLang:previewLang||'en',fields:fields});
  tmplData.currentTemplateId=id;saveTmplData(DT,tmplData);renderTmplBar();renderForm();renderPreview();
};
window._deleteCurrTmpl=function(){
  var tmplData=ensureTmplData(DT,BL_DEFAULT_FIELDS),currId=tmplData.currentTemplateId;
  var curr=tmplData.templates.find(function(t){return t.id===currId;});
  if(!curr||curr.builtIn)return;
  var isZh2=lang==='zh';
  if(!confirm(isZh2?'确认删除模板"'+curr.name+'"?':'Delete template "'+curr.name+'"?'))return;
  tmplData.templates=tmplData.templates.filter(function(t){return t.id!==currId;});
  tmplData.currentTemplateId='tmpl_default';saveTmplData(DT,tmplData);renderTmplBar();renderForm();renderPreview();
};

  var curr=tmplData.templates.find(function(t){return t.id===currId;});

    var pkgType=show('items.packagingType')?it.packagingType:'';

    h+='<td>'+(show('items.description')?esc(it.description||'—'):'')+'</td>';
    h+='<td style="text-align:right;">'+(show('items.grossWeight')?esc(it.grossWeight||'—'):'')+'</td>';
    h+='<td style="text-align:right;">'+(show('items.measurement')?esc(it.measurement||'—'):'')+'</td>';
    h+='</tr>';
  });
  var pkgTypeDefault=d.items&&d.items[0]&&d.items[0].packagingType?d.items[0].packagingType:'PKGS';
  h+='<tr class="total-row-bl"><td colspan="2" style="text-align:right;">'+tr2('TOTAL','合计')+':</td>';
  h+='<td style="text-align:center;">'+(show('totals.totalPkgs')?esc(d.totalPkgs||'—')+' '+pkgTypeDefault:'')+'</td>';
  h+='<td style="text-align:right;">'+(show('totals.totalGrossWeight')?esc(d.totalGrossWeight||'—'):'')+'</td>';
  h+='<td style="text-align:right;">'+(show('totals.totalMeasurement')?esc(d.totalMeasurement||'—'):'')+'</td>';
  h+='</tr></tbody></table>';

  // 5. Container Info (vertical, one per row)
  var cArr=d.containers||[];
  if(cArr.length>0){
    h+='<div class="bl-container-section">';
    cArr.forEach(function(c){
      h+='<div class="bl-container-row">';
      var parts=[];
      if(c.containerNo||c.sealNo)parts.push((c.containerNo||'')+'/'+(c.sealNo||''));
      if(c.containerType)parts.push(c.containerType);
      if(c.cPkgs)parts.push(c.cPkgs+' '+(isZh2?'件':'pkgs'));
      if(c.cGrossWeight)parts.push(c.cGrossWeight+' KG');
      if(c.cMeasurement)parts.push(c.cMeasurement+' CBM');
      if(parts.length)h+=esc(parts.join('  '));
      h+='</div>';
    });
    h+='</div>';
  }

  // 6. Total Packages in Words
  if(show('totals.totalPkgsWords')){
    h+='<div class="bl-words"><span class="wlbl">'+tr2('Total Packages (in words):','大写件数:')+'</span>';
    h+='<strong>'+esc(d.totalPkgsWords||'SAY _____ ONLY')+'</strong></div>';
  } else {
    h+='<div class="bl-words" style="border-top:1.5px solid #111;"><span class="wlbl">'+tr2('Total Packages (in words):','大写件数:')+'</span>';
    h+='<strong>'+esc(d.totalPkgsWords||'SAY _____ ONLY')+'</strong></div>';
  }

  // 7. Freight & Charges (simplified)
  h+='<div class="bl-freight"><div class="flbl">'+tr2('Freight &amp; Charges','运费与费用')+'</div><div class="frow">';
  if(show('header.freightTerms'))h+='<div><span class="flbl2">'+tr2('Terms:','条款:')+'</span> '+esc(d.freightTerms||'—')+'</div>';
  if(show('freight.freightPayableAt'))h+='<div><span class="flbl2">'+tr2('Payable at:','支付地:')+'</span> '+esc(d.freightPayableAt||'—')+'</div>';
  if(show('freight.declaration'))h+='<div><span class="flbl2">'+tr2('Declaration:','声明:')+'</span> '+esc(d.declaration||'')+'</div>';
  h+='</div></div>';

  // 8. Bottom: Originals | Place+Date | Shipped on Board + Signature
  h+='<div class="bl-bottom">';
  h+='<div class="col-original" style="width:22%;">';
  if(show('signature.noOfOriginals')){h+='<div class="blbl">'+tr2('No. of Original B(s)/L','正本份数')+'</div><div class="bval">'+esc(d.noOfOriginals||'THREE (3)')+'</div>';}
  h+='</div>';
  h+='<div style="width:30%;padding:8px 12px;border-right:1.5px solid #111;font-size:10px;">';
  if(show('signature.placeOfIssue')){h+='<div class="blbl">'+tr2('Place of Issue','签发地点')+'</div><div class="bval">'+esc(d.placeOfIssue||'—')+'</div>';}
  if(show('signature.carrierSignatureDate')){h+='<div class="blbl">'+tr2('Date of Issue','签发日期')+'</div><div class="bval">'+esc(d.carrierSignatureDate||'')+'</div>';}
  h+='</div>';
  h+='<div style="flex:1;padding:8px 12px;font-size:10px;">';
  if(show('signature.shippedOnBoardDate')){h+='<div class="blbl">'+tr2('Shipped on Board','已装船日期')+'</div><div class="bval">'+esc(d.shippedOnBoardDate||'—')+'</div>';}
  if(show('signature.carrierName')){h+='<div class="blbl" style="margin-top:6px;">'+tr2('Signed for the Carrier','承运人签章')+'</div><div class="sig-line" style="border-bottom:1.5px solid #111;min-height:28px;margin-top:2px;margin-bottom:2px;"></div><div class="sig-label" style="font-size:9px;color:#555;font-style:italic;">'+esc(d.carrierName||'')+'</div>';}
  h+='</div></div>';

  h+='</div></div>';
  document.getElementById('preview-container').innerHTML=h;
}

// ===== History =====
function renderHistory(){
  var tr=I18N[lang],snaps=loadSnapshots(DT),search=(document.getElementById('history-search').value||'').toLowerCase();
  if(search)snaps=snaps.filter(function(s){return(s.label||'').toLowerCase().indexOf(search)!==-1||(s.ref||'').toLowerCase().indexOf(search)!==-1;});
  var h='';if(snaps.length===0){h+='<div class="history-empty">'+svg('Clock',48)+'<p>'+tr.noHistory+'</p></div>';}
  else{h+='<div style="margin-bottom:12px;font-size:13px;color:var(--text-muted);">'+snaps.length+' '+tr.records+'</div><div class="history-list">';
  snaps.forEach(function(s){h+='<div class="history-item"><div class="history-item-info"><div class="history-item-label">'+esc(s.label||'draft')+'</div>';
  h+='<div class="history-item-ref">'+esc(s.ref||'')+' — '+formatDateTime(s.exportedAt)+'</div></div><div class="history-item-actions">';
  h+='<button class="btn btn-secondary btn-sm" onclick="window._blRestore(\''+s.id+'\')">'+tr.restore+'</button>';
  h+='<button class="btn btn-danger btn-sm" onclick="window._blDeleteSnap(\''+s.id+'\')">'+tr.delete+'</button></div></div>';});
  h+='</div><div style="margin-top:16px;"><button class="btn btn-secondary btn-sm" onclick="window._blClearAllHistory()">'+tr.clearAll+'</button></div>';}
  document.getElementById('history-container').innerHTML=h;document.getElementById('history-search').oninput=function(){renderHistory();};
}

// ===== Event Handlers =====
document.getElementById('lang-btn').onclick=function(){lang=lang==='zh'?'en':'zh';setLang(lang);renderAll();};
document.getElementById('theme-btn').onclick=function(){dark=!dark;setTheme(dark);applyTheme();renderAll();};
injectPageFaq();
document.getElementById('btn-cancel-clear').onclick=function(){showClearConfirm=false;renderClearModal();};
document.getElementById('btn-confirm-clear').onclick=function(){data=getDefaultDoc(DT);saveDocData(DT,data);showClearConfirm=false;renderClearModal();renderForm();renderPreview();};

window._blSet=function(f,v){data[f]=v;saveDocData(DT,data);};
window._blItem=function(idx,f,v){
  data.items[idx][f]=v;
  _blCalcTotals();
  saveDocData(DT,data);renderForm();
};
window._blAddItem=function(){data.items.push(getEmptyItem(DT));_blCalcTotals();saveDocData(DT,data);renderForm();};
window._blRemoveItem=function(idx){
  if(data.items.length>1){data.items.splice(idx,1);_blCalcTotals();saveDocData(DT,data);renderForm();}
};
window._blRestore=function(id){var snaps=loadSnapshots(DT),s=snaps.find(function(x){return x.id===id;});if(s&&s.data){data=JSON.parse(JSON.stringify(s.data));saveDocData(DT,data);renderAll();}};
window._blDeleteSnap=function(id){deleteSnapshot(DT,id);renderHistory();};
window._blClearAllHistory=function(){clearAllSnapshots(DT);renderHistory();};

// ===== Container CRUD =====
window._blContainerItem=function(idx,f,v){data.containers=data.containers||[];data.containers[idx][f]=v;saveDocData(DT,data);};
window._blAddContainer=function(){data.containers=data.containers||[];data.containers.push({containerNo:'',containerType:'',sealNo:'',cPkgs:'',cGrossWeight:'',cMeasurement:''});saveDocData(DT,data);renderForm();};
window._blRemoveContainer=function(idx){data.containers=data.containers||[];if(data.containers.length>1){data.containers.splice(idx,1);saveDocData(DT,data);renderForm();}};

// ===== Init =====
function init(){
  applyTheme();
  var s=loadDocData(DT);
  
  var aiPrefill = loadAiPrefill(DT);
  if (aiPrefill && !s) {
   var defaults = getDefaultDoc(DT);
   data = mergeAiFields(defaults, aiPrefill.fields);
   saveDocData(DT, data);
   localStorage.removeItem(getUserId() + '_ai_prefill_' + DT);
   showAiSuggestion(aiPrefill.suggestion);
  } else { data = s ? s : getDefaultDoc(DT); }
  ensureTmplData(DT,BL_DEFAULT_FIELDS);
  // Migrate: ensure new fields exist + convert signature fields to optional
  migrateTmplData(DT,BL_DEFAULT_FIELDS,function(t){
    ['placeOfIssue','noOfOriginals','shippedOnBoardDate','carrierName','carrierSignatureDate'].forEach(function(sk){
      var fk='signature.'+sk;
      if(t.fields[fk]==='required')t.fields[fk]=true;
    });
  });
  var tmplData=loadTmplData(DT);
  var curr=tmplData&&tmplData.templates?tmplData.templates.find(function(t){return t.id===tmplData.currentTemplateId;}):null;
  if(curr)previewLang=curr.previewLang||'en';
  setupTmplEvents();
  renderAll();
}

init();
