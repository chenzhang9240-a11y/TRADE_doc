<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
var DEEP_BLUE = 'FF203764';
var _hFill = { type:'pattern', pattern:'solid', fgColor:{argb:DEEP_BLUE} };
var _hFont = { bold:true, color:{argb:'FFFFFFFF'}, size:11, name:'Arial' };
var _hBdr = { top:{style:'thin',color:{argb:'FFFFFFFF'}}, bottom:{style:'thin',color:{argb:'FFFFFFFF'}}, left:{style:'thin',color:{argb:'FFFFFFFF'}}, right:{style:'thin',color:{argb:'FFFFFFFF'}} };
var _bdr = { top:{style:'thin',color:{argb:'FF000000'}}, bottom:{style:'thin',color:{argb:'FF000000'}}, left:{style:'thin',color:{argb:'FF000000'}}, right:{style:'thin',color:{argb:'FF000000'}} };
var _ctr = { vertical:'middle', horizontal:'center' };
var _lft = { vertical:'middle', horizontal:'left', wrapText:true };
var _rgt = { vertical:'middle', horizontal:'right', wrapText:true };

function dl(wb,fn) {
  wb.xlsx.writeBuffer().then(function(b) {
    var blob = new Blob([b], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var u = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href=u; a.download=fn;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(u);},10000);
  });
}

  ws.mergeCells(R,7,R,9);
  tr.getCell(7).value='';
  tr.getCell(7).border=_bdr;
  ws.mergeCells(R,10,R,11);
  tr.getCell(10).value=d.totalGrossWeight;
  tr.getCell(10).font={bold:true,size:10,name:'Arial'};
  tr.getCell(10).alignment=_rgt;
  tr.getCell(10).border=_bdr;
  ws.mergeCells(R,12,R,12);
  tr.getCell(12).value=d.totalMeasurement;
  tr.getCell(12).font={bold:true,size:10,name:'Arial'};
  tr.getCell(12).alignment=_rgt;
  tr.getCell(12).border=_bdr;
  tr.height=22;R++;

  // Container info
  ws.getRow(R).height=4;R++;
  ws.mergeCells(R,1,R,12);
  ws.getCell(R,1).value='CONTAINER / 集装箱:  '+d.containers[0].containerNo+'/'+d.containers[0].sealNo+'  '+d.containers[0].containerType+'  '+d.containers[0].cPkgs+' pkgs  '+d.containers[0].cGrossWeight+' KG  '+d.containers[0].cMeasurement+' CBM';
  ws.getCell(R,1).font={size:9,name:'Arial'};
  ws.getRow(R).height=18;R++;

  // Total packages in words
  ws.getRow(R).height=4;R++;
  ws.mergeCells(R,1,R,12);
  ws.getCell(R,1).value='Total Packages (in words) / 大写件数:  '+d.totalPkgsWords;
  ws.getCell(R,1).font={size:10,bold:true,name:'Arial'};
  ws.getCell(R,1).border={top:{style:'thin'}};
  ws.getRow(R).height=22;R++;

  // Freight
  ws.mergeCells(R,1,R,12);
  ws.getCell(R,1).value='FREIGHT & CHARGES / 运费:  '+d.freightTerms+'  Payable at: '+d.freightPayableAt+'  Declaration: '+d.declaration;
  ws.getCell(R,1).font={size:9,name:'Arial'};
  ws.getRow(R).height=18;R++;

  // Bottom section: Originals | Place+Date | Shipped on Board + Signature
  ws.getRow(R).height=4;R++;
  // 3 columns layout
  var botR=ws.getRow(R);
  // Column 1: No of Originals
  ws.mergeCells(R,1,R,4);
  botR.getCell(1).value='No. of Original B(s)/L\n正本份数:\n'+d.noOfOriginals;
  botR.getCell(1).font={size:9,name:'Arial'};
  botR.getCell(1).alignment=_ctr;
  // Column 2: Place + Date
  ws.mergeCells(R,5,R,8);
  botR.getCell(5).value='Place of Issue / 签发地点:\n'+d.placeOfIssue+'\nDate of Issue / 签发日期:\n'+d.carrierSignatureDate;
  botR.getCell(5).font={size:9,name:'Arial'};
  botR.getCell(5).alignment=_ctr;
  // Column 3: Shipped on board + signature
  ws.mergeCells(R,9,R,12);
  botR.getCell(9).value='Shipped on Board / 已装船:\n'+d.shippedOnBoardDate+'\nSigned for the Carrier / 承运人签章:\n'+d.carrierName;
  botR.getCell(9).font={size:9,name:'Arial'};
  botR.getCell(9).alignment=_ctr;
  ws.getRow(R).height=64;R++;

  ws.pageSetup={orientation:'landscape',paperSize:9,fitToPage:true,margins:{left:0.3,right:0.3,top:0.3,bottom:0.3}};
  dl(wb,'bl_B-L-2024-0012.xlsx');
}
